[package]
name = "pacod-gw-analytics"
description = "Usage tracking, statistics and reporting service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pacod-gw-events.workspace = true
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
# float_roundtrip: a cost must come back from storage with the bits it was sent with. Without
# the feature serde_json parses about one in eight 17-digit numbers one unit in the last place off.
serde_json = { workspace = true, features = ["float_roundtrip"] }
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
