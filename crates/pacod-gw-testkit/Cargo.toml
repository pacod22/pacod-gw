[package]
name = "pacod-gw-testkit"
description = "Test support for pacod-gw: scripted mock providers, the smoke test and the load generator (on the engine of pacod-gw-load). Not shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pacod-gw-load.workspace = true
pacod-gw-logging.workspace = true

anyhow.workspace = true
# WebSocket endpoints of the mock, for the gateway's WebSocket relay. The testkit is not shipped.
axum = { workspace = true, features = ["ws"] }
# A WebSocket client for the smoke test, the version axum's ws feature uses.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# Request bodies on `GET /__mock/requests`, embeddings in `encoding_format: base64`, signatures.
base64 = "0.22"
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
# Signing the service-account assertion for Vertex AI (`google.rs`).
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
uuid.workspace = true
