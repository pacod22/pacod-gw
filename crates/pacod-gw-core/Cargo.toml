[package]
name = "pacod-gw-core"
description = "AI gateway core: data plane (proxy and managed mode) and management API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pacod_gw_core"
path = "src/lib.rs"

[[bin]]
name = "pacod-gw-core"
path = "src/main.rs"

[features]
default = ["routing-cel", "plugin-intent", "plugin-cache"]
# CEL conditions in routing rules.
routing-cel = ["dep:cel"]
# The intent plugin (docs/plugin-concept.md). Its settings and catalogue types are always
# compiled, so that the API and the stored configuration do not depend on the build; the
# feature registers the plugin.
plugin-intent = []
# The response cache plugin (docs/plugin-concept.md, section 15), the same way.
plugin-cache = []

[dependencies]
pacod-gw-dialects.workspace = true
pacod-gw-events.workspace = true
pacod-gw-logging.workspace = true
pacod-gw-plugin.workspace = true
pacod-gw-plugin-cache.workspace = true
pacod-gw-plugin-intent.workspace = true
pacod-id-authz.workspace = true
pacod-id-client.workspace = true

anyhow.workspace = true
arc-swap.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
crc32fast.workspace = true
fastrand.workspace = true
futures-util.workspace = true
hex.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
memchr.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true
mimalloc.workspace = true
parking_lot.workspace = true
pin-project-lite.workspace = true
redis.workspace = true
lettre.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_ignored.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
# WebSocket frames for the managed Realtime sessions: the version axum's ws feature uses.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
toml.workspace = true
tower.workspace = true
tower-service.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
cron = "0.17.0"
cel = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
pacod-gw-testkit.workspace = true
# pacod-id in process, for the tests in OIDC mode (never in a shipped binary).
pacod-id.workspace = true
pacod-id-authz = { workspace = true, features = ["vectors"] }
criterion = { version = "0.8", default-features = false }
insta.workspace = true
proptest.workspace = true

[[bench]]
name = "route"
harness = false
