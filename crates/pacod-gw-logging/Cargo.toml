[package]
name = "pacod-gw-logging"
description = "The log of every pacod-gw binary: the event of the pacod logging convention (pacod-demo/docs/LOGGING.md) in JSON or text, and its level and format from the environment"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Records of crates that log through the `log` facade (rustls, among others) become events.
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
tracing-subscriber.workspace = true
