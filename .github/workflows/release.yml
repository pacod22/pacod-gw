name: Release

# Runs only when a version tag (v1.2.3) is pushed. Builds the four images of an installation,
# pushes them to the GitHub Container Registry, signs each by its digest with cosign (keyless:
# GitHub's OIDC token, recorded in the public transparency log), and attaches its bill of
# materials as a signed attestation. Third-party actions are pinned to a commit, as in ci.yml.
#
# Check an image before running it:
#   cosign verify ghcr.io/<owner>/pacod-gw-core:<version> \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repository>/.github/workflows/release.yml@refs/tags/v.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SYFT_VERSION: "v1.54.1"

jobs:
  image:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Push to ghcr.io.
      packages: write
      # Keyless signing.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pacod-gw-core
            file: deploy/docker/rust.Dockerfile
            target: core
          - image: pacod-gw-analytics
            file: deploy/docker/rust.Dockerfile
            target: analytics
          - image: pacod-gw-ui
            file: deploy/docker/ui.Dockerfile
            target: ""
          - image: pacod-gw-tester
            file: deploy/docker/tester.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Names
        id: names
        run: |
          # Registry paths are lower case; the tag without its "v" is the version.
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.names.outputs.repo }}:${{ steps.names.outputs.version }}
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            VCS_REF=${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        env:
          IMAGE: ${{ steps.names.outputs.repo }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Bill of materials, attested
        env:
          IMAGE: ${{ steps.names.outputs.repo }}@${{ steps.build.outputs.digest }}
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sbom
          docker run --rm -e SYFT_REGISTRY_AUTH_AUTHORITY -e SYFT_REGISTRY_AUTH_USERNAME \
            -e SYFT_REGISTRY_AUTH_PASSWORD "anchore/syft:$SYFT_VERSION" \
            "registry:$IMAGE" -o spdx-json > "sbom/${{ matrix.image }}.spdx.json"
          cosign attest --yes --type spdxjson --predicate "sbom/${{ matrix.image }}.spdx.json" "$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom/
