[workspace]
resolver = "3"
members = [
    "crates/pacod-gw-core",
    "crates/pacod-gw-dialects",
    "crates/pacod-gw-events",
    "crates/pacod-gw-analytics",
    "crates/pacod-gw-bench-report",
    "crates/pacod-gw-lite",
    "crates/pacod-gw-load",
    "crates/pacod-gw-logging",
    "crates/pacod-gw-plugin",
    "crates/pacod-gw-plugin-cache",
    "crates/pacod-gw-plugin-intent",
    "crates/pacod-gw-testkit",
]
# pacod-id, vendored by scripts/vendor-pacod-id.sh: its crates are path dependencies, not members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
# Built into images, never published to crates.io.
publish = false

[workspace.dependencies]
pacod-gw-bench-report = { path = "crates/pacod-gw-bench-report" }
pacod-gw-core = { path = "crates/pacod-gw-core" }
pacod-gw-dialects = { path = "crates/pacod-gw-dialects" }
pacod-gw-events = { path = "crates/pacod-gw-events" }
pacod-gw-load = { path = "crates/pacod-gw-load" }
pacod-gw-logging = { path = "crates/pacod-gw-logging" }
pacod-gw-plugin = { path = "crates/pacod-gw-plugin" }
pacod-gw-plugin-cache = { path = "crates/pacod-gw-plugin-cache" }
pacod-gw-plugin-intent = { path = "crates/pacod-gw-plugin-intent" }
pacod-gw-testkit = { path = "crates/pacod-gw-testkit" }
# pacod-id (vendor/pacod-id, pinned in vendor/pacod-id/VERSION): the rules engine, the client
# library the core signs people in with, and the service itself, which tests start in process.
pacod-id-authz = { path = "vendor/pacod-id/crates/pacod-id-authz" }
pacod-id-client = { path = "vendor/pacod-id/crates/pacod-id-client" }
pacod-id = { path = "vendor/pacod-id/crates/pacod-id" }

anyhow = "1"
arc-swap = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["http2", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
fastrand = "2"
futures-util = "0.3"
hex = "0.4"
html2text = "0.17"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "rustls-native-certs"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
# getrusage, for the load agent's own CPU use.
libc = "0.2"
memchr = "2"
# SMTP for account emails. No native-tls: TLS goes through rustls with ring, like everything else.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls", "ring", "webpki-roots"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-util = { version = "0.20", default-features = false }
mimalloc = { version = "0.1", default-features = false }
parking_lot = "0.12"
pin-project-lite = "0.2"
# Valkey, for the response cache. TLS through rustls with ring, like everything else.
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
serde_ignored = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "chrono", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.8"
tower = { version = "0.5", features = ["limit", "util"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = "1"

# test-only
insta = { version = "1", features = ["json"] }
proptest = "1"

# RSA key generation (the in-process pacod-id of the tests makes one at every start) is slow
# without optimisation. Profiles apply from the root workspace only, so pacod-id's own settings
# do not reach here.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
