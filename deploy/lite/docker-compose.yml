# pacod-gw-lite: the minimal gateway (docs/lite.md).
#
#   docker network inspect pacod-net >/dev/null 2>&1 || docker network create pacod-net
#   docker compose -f deploy/lite/docker-compose.yml up -d --wait
#
# One container: the full gateway's data plane without PostgreSQL, ClickHouse, console,
# management API or metrics. Its whole configuration is deploy/lite/.env (copy
# deploy/lite/.env.example; the file is git-ignored), which Compose hands to the container as
# environment variables. Every call is one line in the container's log:
#
#   docker compose -f deploy/lite/docker-compose.yml logs -f pacod-gw
#
# Its own project name and port, on the shared network pacod-net (pacod-demo/docs/NETWORK.md)
# under the gateway's shared name, pacod-gw: applications on this host reach it as
# http://pacod-gw:8080, as they would reach the full gateway. So it does not run on the same
# host as the full stack (project pacod-gw), which has a pacod-gw of its own.
#
# Never print `docker compose ... config` for this file with a real .env: it shows the
# provider keys.

name: pacod-gw-lite

# Every service rotates its log (pacod-demo/docs/LOGGING.md). The gateway's log is also its
# record of the calls: 5 files of 10 MB, the size every pacod service keeps. Ship it to a log
# collector where more must be kept.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  pacod-gw:
    image: ${PGW_REGISTRY:-}pacod-gw-lite:${PGW_VERSION:-0.1.0}
    container_name: pacod-gw
    # The root file system stays read-only: the gateway writes only its record of files and
    # batches, on the volume below.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["serve"]
    env_file:
      - path: ${PGW_LITE_ENV_FILE:-.env}
        required: true
    environment:
      # Inside the container; PGW_LITE_BIND and PGW_LITE_PORT publish it.
      PGW_LISTEN: 0.0.0.0:8080
      SERVICE_NAME: pacod-gw
      # Files and batches made through the gateway, and who made them (docs/lite.md, section 14).
      PGW_OBJECTS_DIR: /var/lib/pacod-gw/objects
    volumes:
      - gw-lite-objects:/var/lib/pacod-gw/objects
      # The intent plugin reads its catalogue from a file (PGW_INTENT_FILE). Mount it read-only:
      # - ./intents.yaml:/etc/pacod-gw/intents.yaml:ro
    ports:
      - "${PGW_LITE_BIND:-127.0.0.1}:${PGW_LITE_PORT:-14080}:8080"
    # A model server on this host (Ollama) is reached as host.docker.internal; allow it in
    # PGW_EGRESS_ALLOW_PRIVATE.
    extra_hosts: ["host.docker.internal:host-gateway"]
    ulimits:
      # Two sockets per stream in flight.
      nofile: { soft: 65536, hard: 65536 }
    # Longer than the drain delay plus the drain time (PGW_DRAIN_SECONDS, 30 s), so that
    # running streams can finish.
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    networks: [pacod-net]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 512M }

volumes:
  gw-lite-objects:

networks:
  pacod-net:
    external: true
