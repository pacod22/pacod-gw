# The minimal gateway for development, built from the working tree, against the mock
# provider (make lite-dev-up):
#
#   docker compose -p pacod-gw-lite-dev -f deploy/lite/docker-compose.yml \
#     -f deploy/lite/docker-compose.dev.yml up -d --build --wait
#
#   pacod-gw   127.0.0.1:18280
#   gw-mock    127.0.0.1:19280   (the mock's control endpoints, for scripting failures)
#
# It reads no env file: the configuration below is fixed, with public development keys that
# only the mock accepts. It is on pacod-net under the shared names pacod-gw and gw-mock, so it
# does not run at the same time as the development stack of the full gateway ("make dev-down"
# first).
#
# The intent plugin classifies every call in shadow mode with the example catalogue. Its model
# has a mock of its own (gw-mock-intent): a classification runs alongside the call, and on the
# same mock it could take a failure scripted for the call.

services:
  pacod-gw:
    image: pacod-gw-lite:dev
    build:
      context: ../..
      dockerfile: deploy/docker/rust.Dockerfile
      target: lite
    env_file: !reset []
    environment:
      PGW_LISTEN: 0.0.0.0:8080
      PGW_LOG_FORMAT: text
      RUST_LOG: info
      PGW_LOG_BODIES: on_request
      PGW_EGRESS_ALLOW_PRIVATE: gw-mock,gw-mock-intent
      PGW_PROVIDER_OPENAI_KEY: dev-openai-key
      PGW_PROVIDER_OPENAI_BASE_URL: http://gw-mock:9000/v1
      PGW_PROVIDER_ANTHROPIC_KEY: dev-anthropic-key
      PGW_PROVIDER_ANTHROPIC_BASE_URL: http://gw-mock:9000
      PGW_PROVIDER_DEEPSEEK_KEY: dev-deepseek-key
      PGW_PROVIDER_DEEPSEEK_BASE_URL: http://gw-mock:9000/emulate/deepseek
      PGW_MODEL_GPT: openai/gpt-dev
      PGW_MODEL_GPT_PRICE: input=1.25,output=10,cache_read=0.125
      PGW_MODEL_CLAUDE: anthropic/claude-dev
      PGW_MODEL_CLAUDE_PRICE: input=3,output=15,cache_read=0.3,cache_write_5m=3.75
      PGW_MODEL_DEEPSEEK: deepseek/deepseek-chat
      PGW_MODEL_DEEPSEEK_PRICE: input=0.28,output=0.42,cache_read=0.028
      PGW_MODEL_EMBED: openai/text-embedding-dev
      PGW_MODEL_EMBED_PRICE: input=0.02
      PGW_MODEL_TTS: openai/tts-dev
      PGW_MODEL_TTS_PRICE: per_character=0.000015
      PGW_POOL_FAST: openai/gpt-dev,anthropic/claude-dev,deepseek/deepseek-chat
      PGW_CLIENT_DEV_KEY: pgw_dev_DevelopmentOnlyKey0123456789
      PGW_CLIENT_LIMITED_KEY: pgw_limited_DevelopmentOnlyKey012345
      PGW_CLIENT_LIMITED_RPM: "3"
      PGW_CLIENT_LIMITED_MODELS: openai/gpt-dev
      PGW_PROVIDER_CLASSIFIER_PRESET: openai
      PGW_PROVIDER_CLASSIFIER_KEY: dev-classifier-key
      PGW_PROVIDER_CLASSIFIER_BASE_URL: http://gw-mock-intent:9000/v1
      PGW_MODEL_INTENT: classifier/gpt-intent
      PGW_MODEL_INTENT_PRICE: input=0.15,output=0.6
      PGW_INTENT_MODE: shadow
      PGW_INTENT_FILE: /etc/pacod-gw/intents.yaml
      PGW_INTENT_MODEL: classifier/gpt-intent
    volumes:
      - ./intents.example.yaml:/etc/pacod-gw/intents.yaml:ro
    ports: !override
      - "127.0.0.1:${PGW_LITE_DEV_PORT:-18280}:8080"
    extra_hosts: !reset []
    depends_on:
      gw-mock: { condition: service_healthy }
      gw-mock-intent: { condition: service_healthy }

  gw-mock:
    image: pacod-gw-mock:dev
    container_name: gw-mock
    build:
      context: ../..
      dockerfile: deploy/docker/rust.Dockerfile
      target: mock
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${PGW_LITE_DEV_MOCK_PORT:-19280}:9000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
      start_interval: 1s
    networks: [pacod-net]

  gw-mock-intent:
    image: pacod-gw-mock:dev
    container_name: gw-mock-intent
    build:
      context: ../..
      dockerfile: deploy/docker/rust.Dockerfile
      target: mock
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
      start_interval: 1s
    networks: [pacod-net]
