# pacod-gw on the shared network pacod-net: the app file (concept section 17, "Standard" setup).
# It holds the gateway's own services alone:
#
#   gw-preflight   checks the secrets, then stops
#   pacod-gw       the core: data plane (8080), management API (8081), metrics (9100)
#   gw-analytics   usage events, reports and scheduled jobs (8090), on gw-clickhouse
#   gw-console     the admin console (3000)
#   gw-tester      the test engine behind the console's Testing page (8095)
#   gw-clickhouse  the analytics store
#   gw-valkey      the response cache's store: answers kept in memory, shared by the gateways
#
# The shared components it uses (pacod-postgres, pacod-db-init, pacod-id, pacod-caddy, pacod-otel,
# pacod-prometheus, pacod-alertmanager, pacod-grafana) come from docker-compose.standalone.yml in
# the gateway's own stack, or from the full stack (pacod-demo), which loads this file and provides
# them once. They are reached by those names; every depends_on on one of them carries
# "required: false". The naming convention is in pacod-demo/docs/NETWORK.md.
#
#   docker network inspect pacod-net >/dev/null 2>&1 || docker network create pacod-net
#   docker network inspect pacod-admin-net >/dev/null 2>&1 || docker network create --internal pacod-admin-net
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.standalone.yml up -d --wait
#
# ("make up"). Settings and secrets are read from deploy/.env (copy deploy/.env.example; the
# file is git-ignored). docs/runbook.md describes the first deployment step by step.
#
# What is reachable from where:
#   - Every service is on pacod-net, the network of all pacod stacks on this host. Nothing
#     here publishes a port: pacod-caddy serves the data plane on the API host name and the
#     console on the console host name (platform/caddy/gw.caddy).
#   - The management API (port 8081) is on pacod-admin-net only, the internal network of the
#     listeners that only servers reach. The core binds it to pacod-gw-admin, the alias it has
#     there alone: a container that listens on 0.0.0.0 is reachable on every network it joins,
#     so joining pacod-admin-net would not keep the rest of pacod-net out. The console, the
#     analytics service and the tester join pacod-admin-net and call
#     http://pacod-gw-admin:8081. Caddy does not forward to it unless the block in
#     platform/caddy/gw.caddy is enabled.
#   - The tester (port 8095) has one client, the console.
#   - pacod-id signs people in (runbook section 16) when PGW_AUTH is "oidc"; "local" (the
#     default) leaves it to the gateway itself. The core, the console and the tester reach its
#     internal listener on pacod-admin-net too, at http://pacod-id-internal:8071.
#
# The core connects to pacod-postgres as the role pacod_gw, which owns the database pacod_gw and
# is not a superuser (platform/postgres/gw-db.sh, run by pacod-db-init). Its password is
# GW_DB_PASSWORD, never the superuser's POSTGRES_PASSWORD.
#
# One core serves the data plane and the management API. docker-compose.scale.yml splits
# them and runs several gateways; docker-compose.hub.yml lets gateways on other machines
# (deploy/node/) join. See docs/runbook.md, section 9.
#
# The resource limits of this file add up to about 4 GB and those of
# docker-compose.standalone.yml to about 3 GB, which leaves room for the operating system on a
# host with 8 GB.

name: pacod-gw

# Logging follows pacod-demo/docs/LOGGING.md: every service rotates its log (5 files of 10 MB),
# the gateway's own services name themselves with SERVICE_NAME, and RUST_LOG, PGW_LOG_FORMAT
# (json or text) and TESTER_LOG_LEVEL set the level and format of all of them.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# For the images built from this repository: no capabilities, no privilege escalation and a
# read-only root file system. The binaries are static and run as an unprivileged user.
x-locked-down: &locked-down
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Runs once before everything else and stops the start when a secret is missing or too
  # short. Without it, a missing value would only show up as a restarting container. It checks
  # the gateway's own secrets; docker-compose.standalone.yml adds those of its shared components.
  gw-preflight:
    image: busybox:1.38.0
    container_name: gw-preflight
    <<: *locked-down
    restart: "no"
    network_mode: none
    command: ["sh", "/preflight.sh"]
    volumes:
      - ./scripts/preflight.sh:/preflight.sh:ro
    environment:
      GW_DB_PASSWORD: ${GW_DB_PASSWORD:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      PGW_KEK: ${PGW_KEK:-}
      PGW_KEK_ID: ${PGW_KEK_ID:-default}
      PGW_KEK_OLD: ${PGW_KEK_OLD:-}
      PGW_KEY_PEPPER: ${PGW_KEY_PEPPER:-}
      PGW_INTERNAL_TOKEN: ${PGW_INTERNAL_TOKEN:-}
      PGW_VALKEY_PASSWORD: ${PGW_VALKEY_PASSWORD:-}
      PGW_AUTH: ${PGW_AUTH:-local}
      # Needed with PGW_AUTH=oidc only: the clients of the core, the console and the tester at
      # pacod-id, and the key of the console's session cookie.
      PGW_ID_CLIENT_SECRET: ${PGW_ID_CLIENT_SECRET:-}
      PGW_UI_CLIENT_SECRET: ${PGW_UI_CLIENT_SECRET:-}
      PGW_UI_SESSION_SECRET: ${PGW_UI_SESSION_SECRET:-}
      TESTER_ID_CLIENT_SECRET: ${TESTER_ID_CLIENT_SECRET:-}
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 32M }

  # ------------------------------------------------------------------------------------------
  # Store
  # ------------------------------------------------------------------------------------------
  gw-clickhouse:
    image: clickhouse/clickhouse-server:26.8.17.4
    container_name: gw-clickhouse
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      CLICKHOUSE_DB: pacod_gw
      CLICKHOUSE_USER: pacod_gw
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - gw-clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/pacod-gw.xml:/etc/clickhouse-server/config.d/pacod-gw.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # By host name, not 127.0.0.1: during first-time initialisation a temporary server
      # listens on the loopback address only, and it must not count as ready.
      test: ["CMD-SHELL", "wget -q --spider \"http://$$(hostname):8123/ping\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
      start_interval: 2s
    depends_on:
      gw-preflight: { condition: service_completed_successfully }
    networks: [pacod-net]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  # The response cache's store (docs/plugin-concept.md, section 15). Answers are kept in memory
  # only, never written to disk, and the least recently used go first when it is full; the
  # gateways seal them with a key derived from PGW_KEK before they come here. Its password is
  # written into a configuration file at start, not onto the command line, where "ps" and
  # "docker inspect" would show it; the health check passes it in REDISCLI_AUTH. With a
  # certificate in /run/valkey-tls (docker-compose.hub.yml mounts one), it also serves TLS on
  # port 6380, for gateways on other machines; the gateways here stay on 6379.
  gw-valkey:
    image: valkey/valkey:9.1.2-alpine3.24
    container_name: gw-valkey
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        umask 077
        printf 'requirepass %s\nsave ""\nappendonly no\nmaxmemory %s\nmaxmemory-policy allkeys-lru\n' \
          "$$VALKEY_PASSWORD" "$$VALKEY_MAXMEMORY" > /run/valkey/valkey.conf
        if [ -f /run/valkey-tls/valkey.crt ]; then
          printf 'tls-port 6380\ntls-cert-file %s\ntls-key-file %s\ntls-auth-clients no\n' \
            /run/valkey-tls/valkey.crt /run/valkey-tls/valkey.key >> /run/valkey/valkey.conf
        fi
        exec valkey-server /run/valkey/valkey.conf
    environment:
      VALKEY_PASSWORD: ${PGW_VALKEY_PASSWORD:-}
      # The most it holds; size it with the memory limit below.
      VALKEY_MAXMEMORY: ${PGW_VALKEY_MAXMEMORY:-384mb}
    tmpfs:
      - /run/valkey:size=1m,uid=999,gid=1000
      - /data:size=1m,uid=999,gid=1000
    user: "999:1000"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    depends_on:
      gw-preflight: { condition: service_completed_successfully }
    networks: [pacod-net]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # ------------------------------------------------------------------------------------------
  # pacod-gw
  # ------------------------------------------------------------------------------------------
  pacod-gw:
    image: ${PGW_REGISTRY:-}pacod-gw-core:${PGW_VERSION:-0.1.0}
    container_name: pacod-gw
    <<: *locked-down
    restart: unless-stopped
    command: ["serve"]
    environment:
      PGW_ROLE: all
      # How the instance is named in the console, in metrics and in usage events. The
      # Prometheus target in platform/prometheus/gw.yml carries the same name. It is data, not
      # the service's name: it stays "core".
      PGW_INSTANCE_ID: core
      PGW_LISTEN: 0.0.0.0:8080
      # The core's address on pacod-admin-net alone (see the header).
      PGW_ADMIN_LISTEN: pacod-gw-admin:8081
      PGW_METRICS_LISTEN: 0.0.0.0:9100
      # The password is part of a URL: generate it with "openssl rand -hex 24".
      DATABASE_URL: postgres://pacod_gw:${GW_DB_PASSWORD:-}@pacod-postgres:5432/pacod_gw
      PGW_KEK: ${PGW_KEK:-}
      PGW_KEK_ID: ${PGW_KEK_ID:-default}
      PGW_KEK_OLD: ${PGW_KEK_OLD:-}
      PGW_KEY_PEPPER: ${PGW_KEY_PEPPER:-}
      PGW_ANALYTICS_URL: http://gw-analytics:8090
      PGW_INTERNAL_TOKEN: ${PGW_INTERNAL_TOKEN:-}
      PGW_SPOOL_DIR: /var/lib/pacod-gw/spool
      PGW_ADMIN_EMAIL: ${PGW_ADMIN_EMAIL:-}
      PGW_ADMIN_PASSWORD: ${PGW_ADMIN_PASSWORD:-}
      PGW_OTLP_ENDPOINT: http://pacod-otel:4318
      PGW_EGRESS_ALLOW_PRIVATE: ${PGW_EGRESS_ALLOW_PRIVATE:-}
      # Whose X-Forwarded-For is believed: Caddy, which is on a private network here.
      PGW_TRUSTED_PROXIES: ${PGW_TRUSTED_PROXIES:-private_ranges}
      # Empty: 10 connections, 4 for the role gateway.
      PGW_DB_MAX_CONNECTIONS: ${PGW_DB_MAX_CONNECTIONS:-}
      # Account emails (email verification, password reset). Empty PGW_SMTP_HOST: none are sent.
      PGW_SMTP_HOST: ${PGW_SMTP_HOST:-}
      PGW_SMTP_PORT: ${PGW_SMTP_PORT:-}
      PGW_SMTP_TLS: ${PGW_SMTP_TLS:-}
      PGW_SMTP_USERNAME: ${PGW_SMTP_USERNAME:-}
      PGW_SMTP_PASSWORD: ${PGW_SMTP_PASSWORD:-}
      PGW_EMAIL_FROM_ADDRESS: ${PGW_EMAIL_FROM_ADDRESS:-}
      PGW_EMAIL_FROM_NAME: ${PGW_EMAIL_FROM_NAME:-}
      PGW_CONSOLE_URL: ${PGW_CONSOLE_URL:-}
      # Who signs people in: local (this core) or oidc (pacod-id). Read only with oidc:
      PGW_AUTH: ${PGW_AUTH:-local}
      PGW_ID_ISSUER: ${PGW_ID_ISSUER:-https://${PGW_ID_HOST:-id.localhost}}
      PGW_ID_INTERNAL_URL: http://pacod-id-internal:8071
      PGW_ID_CLIENT_SECRET: ${PGW_ID_CLIENT_SECRET:-}
      # The response cache's store, shared by every gateway. Without it each gateway keeps
      # answers in its own memory.
      PGW_VALKEY_URL: redis://gw-valkey:6379/0
      PGW_VALKEY_PASSWORD: ${PGW_VALKEY_PASSWORD:-}
      # The mode the response cache is installed with on the first start: off, so that no
      # answer is kept before an administrator switches it on in the console.
      PGW_CACHE_DEFAULT_MODE: ${PGW_CACHE_DEFAULT_MODE:-off}
      SERVICE_NAME: pacod-gw
      RUST_LOG: ${RUST_LOG:-info}
      # json (one JSON object per line) or text.
      PGW_LOG_FORMAT: ${PGW_LOG_FORMAT:-json}
    volumes:
      - gw-spool:/var/lib/pacod-gw/spool
    tmpfs:
      - /tmp:size=64m
    ulimits:
      # Two sockets per stream in flight, plus the database pool.
      nofile: { soft: 65536, hard: 65536 }
    # Longer than the time a stopping core keeps serving while it fails /readyz (6 s) plus
    # its drain time (30 s), so that running streams can finish.
    stop_grace_period: 50s
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    depends_on:
      gw-preflight: { condition: service_completed_successfully }
      pacod-postgres: { condition: service_healthy, required: false }
      # Creates the role pacod_gw and its database where they do not exist yet.
      pacod-db-init: { condition: service_completed_successfully, required: false }
      pacod-otel: { condition: service_started, required: false }
      # Started first, not awaited: in local mode the core does not need it, and in OIDC mode it
      # waits for pacod-id itself (management calls answer 503 until then).
      pacod-id: { condition: service_started, required: false }
      # Started first, not awaited: calls are served without the cache until it answers.
      gw-valkey: { condition: service_started }
    networks:
      pacod-net:
      pacod-admin-net:
        aliases: [pacod-gw-admin]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }

  gw-analytics:
    image: ${PGW_REGISTRY:-}pacod-gw-analytics:${PGW_VERSION:-0.1.0}
    container_name: gw-analytics
    <<: *locked-down
    restart: unless-stopped
    environment:
      ANALYTICS_LISTEN: 0.0.0.0:8090
      CLICKHOUSE_URL: http://gw-clickhouse:8123
      CLICKHOUSE_DATABASE: pacod_gw
      CLICKHOUSE_USER: pacod_gw
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      PGW_INTERNAL_TOKEN: ${PGW_INTERNAL_TOKEN:-}
      PGW_CORE_ADMIN_URL: http://pacod-gw-admin:8081
      # The price job fetches its sources under the same rule as the core calls providers.
      PGW_EGRESS_ALLOW_PRIVATE: ${PGW_EGRESS_ALLOW_PRIVATE:-}
      SERVICE_NAME: gw-analytics
      RUST_LOG: ${RUST_LOG:-info}
      ANALYTICS_LOG_FORMAT: ${PGW_LOG_FORMAT:-json}
    tmpfs:
      - /tmp:size=64m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    depends_on:
      gw-preflight: { condition: service_completed_successfully }
      gw-clickhouse: { condition: service_healthy }
    networks: [pacod-net, pacod-admin-net]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  gw-console:
    image: ${PGW_REGISTRY:-}pacod-gw-ui:${PGW_VERSION:-0.1.0}
    container_name: gw-console
    <<: *locked-down
    restart: unless-stopped
    environment:
      SERVICE_NAME: gw-console
      # The management API, called from the server side of the console only.
      GATEWAY_API_URL: http://pacod-gw-admin:8081
      # Prometheus, for the console's Metrics page; also server side only.
      PROMETHEUS_URL: http://pacod-prometheus:9090
      # Grafana as the browser reaches it, for a link on the Monitoring page; empty hides it.
      GRAFANA_URL: ${PGW_GRAFANA_URL:-}
      # The tester, for the console's Testing page; also server side only. The console starts
      # without it: the page then says that testing is not reachable.
      TESTER_URL: http://gw-tester:8095
      # Signing in through pacod-id with PGW_AUTH=oidc; the core's setting must be the same.
      PGW_AUTH: ${PGW_AUTH:-local}
      PGW_ID_ISSUER: ${PGW_ID_ISSUER:-https://${PGW_ID_HOST:-id.localhost}}
      PGW_ID_INTERNAL_URL: http://pacod-id-internal:8071
      PGW_UI_CLIENT_SECRET: ${PGW_UI_CLIENT_SECRET:-}
      PGW_UI_SESSION_SECRET: ${PGW_UI_SESSION_SECRET:-}
      PGW_CONSOLE_URL: ${PGW_CONSOLE_URL:-https://${PGW_CONSOLE_HOST:-console.localhost}}
      # adapter-node 6 has no ORIGIN variable. The origin is the Host header plus this header,
      # both of which Caddy passes. Without them form posts fail the CSRF check.
      PROTOCOL_HEADER: x-forwarded-proto
      ADDRESS_HEADER: x-forwarded-for
      # A benchmark report upload is up to 1 MiB, above adapter-node's default of 512K.
      BODY_SIZE_LIMIT: 2M
      XFF_DEPTH: "1"
      HOST: 0.0.0.0
      PORT: "3000"
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      # The forwarded headers are sent because ADDRESS_HEADER makes them mandatory. A
      # redirect to the login page counts as healthy.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/',{redirect:'manual',headers:{'x-forwarded-for':'127.0.0.1','x-forwarded-proto':'http'}}).then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      pacod-gw: { condition: service_healthy }
    networks: [pacod-net, pacod-admin-net]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # Runs the test cases of the console's Testing page against the core. Every run uses the
  # session of the platform admin who started it, which the tester checks with the core; with
  # pacod-id, a delegated grant of that session (its own client secret). Not published; the
  # console is its one client.
  gw-tester:
    image: ${PGW_REGISTRY:-}pacod-gw-tester:${PGW_VERSION:-0.1.0}
    container_name: gw-tester
    <<: *locked-down
    restart: unless-stopped
    environment:
      PGW_CORE_ADMIN_URL: http://pacod-gw-admin:8081
      PGW_CORE_DATA_URL: http://pacod-gw:8080
      # Mock mode needs a scripted provider. Production has none, so only live mode is offered.
      TESTER_MOCK_URL: ${TESTER_MOCK_URL:-}
      TESTER_MOCK_CONTROL_URL: ${TESTER_MOCK_CONTROL_URL:-}
      PGW_AUTH: ${PGW_AUTH:-local}
      PGW_ID_INTERNAL_URL: http://pacod-id-internal:8071
      TESTER_ID_CLIENT_SECRET: ${TESTER_ID_CLIENT_SECRET:-}
      SERVICE_NAME: gw-tester
      TESTER_LOG_LEVEL: ${TESTER_LOG_LEVEL:-info}
      TESTER_LOG_FORMAT: ${PGW_LOG_FORMAT:-json}
    volumes:
      # The run history and the uploaded suites.
      - gw-tester-data:/data
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/healthz', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    depends_on:
      pacod-gw: { condition: service_healthy }
    networks: [pacod-net, pacod-admin-net]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

# Both are shared by every pacod stack on this host; "make network" creates them.
networks:
  pacod-net:
    external: true
  # Internal (no route out): the listeners that only servers reach, and their clients.
  pacod-admin-net:
    external: true

# Installations made before the services were renamed keep their data in the volumes of the old
# names (pacod-gw_clickhouse-data, ...); docs/runbook.md, section 19, moves it.
volumes:
  gw-clickhouse-data:
  gw-spool:
  gw-tester-data:
