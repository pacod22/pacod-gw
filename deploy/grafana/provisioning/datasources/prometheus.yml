# The Prometheus of the compose stack (pacod-prometheus). The uid is fixed so that links stay
# valid when the stack is rebuilt; the dashboards pick the data source through their
# "datasource" variable. The full stack (pacod-demo) gives its Prometheus the same uid.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://pacod-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      # Same as scrape_interval in deploy/prometheus/prometheus.yml.
      timeInterval: 15s
