# OpenTelemetry collector for the pacod-gw compose stack.
#
# The core sends its traces here with OTLP over HTTP (PGW_OTLP_ENDPOINT, port 4318). gRPC on
# 4317 is open as well, for other senders. Metrics do not pass through the collector:
# Prometheus scrapes the core directly.
#
# By default the traces go to the debug exporter, which writes a short summary to the
# collector's log. That proves the path works and stores nothing. For a real trace backend,
# uncomment one of the exporters below and name it in the pipeline at the end.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # First in the pipeline: refuses data before the container's 256 MB limit is reached.
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

  # A backend that speaks OTLP over gRPC, for example Grafana Tempo or Jaeger:
  #
  # otlp_grpc/backend:
  #   endpoint: tempo.example.internal:4317
  #   tls:
  #     insecure: false
  #
  # A hosted backend that speaks OTLP over HTTP and wants an API key:
  #
  # otlp_http/backend:
  #   endpoint: https://otlp.example.com
  #   headers:
  #     authorization: "Bearer ${env:TRACE_BACKEND_TOKEN}"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
      # With a backend: exporters: [otlp_grpc/backend]
