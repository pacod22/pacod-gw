# pacod-gw: the scale layout for development, on top of the development stack:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml \
#     -f deploy/docker-compose.scale.yml -f deploy/docker-compose.scale.dev.yml up -d --build --wait
#
# ("make dev-scale-up"). The gateways extend the core of docker-compose.yml, not the merged
# development core, so they get the development image and secrets here.
#
# Ports on 127.0.0.1, in addition to those of docker-compose.dev.yml:
#
#   data plane through Caddy   18080 (the default of the smoke and load tools)
#   gateway-1                  18082, metrics 19101
#   gateway-2                  18083, metrics 19102
#   management API (core)      18081, metrics 19100 (no data plane any more)
#
# For a gateway that plays another machine, see deploy/node/docker-compose.dev.yml: it reaches
# this stack only through published ports, and Caddy reaches it at host.docker.internal:18180
# once PGW_DATA_UPSTREAMS names it.
#
# The defaults below are public. Never use this file for anything reachable by others.

x-dev-gateway: &dev-gateway
  image: pacod-gw-core:dev
  build:
    context: ..
    dockerfile: deploy/docker/rust.Dockerfile
    target: core
  extra_hosts: ["host.docker.internal:host-gateway"]

x-dev-gateway-env: &dev-gateway-env
  DATABASE_URL: postgres://pacod_gw:${POSTGRES_PASSWORD:-pacod_gw_dev_postgres}@postgres:5432/pacod_gw
  PGW_KEK: ${PGW_KEK:-ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=}
  PGW_KEK_ID: ${PGW_KEK_ID:-dev}
  PGW_KEY_PEPPER: ${PGW_KEY_PEPPER:-dev-only-pepper-do-not-use-in-prod}
  PGW_INTERNAL_TOKEN: ${PGW_INTERNAL_TOKEN:-dev-only-internal-token-0123456789}
  # The mock by its compose name, or through the host for the gateway on "another machine".
  PGW_EGRESS_ALLOW_PRIVATE: ${PGW_EGRESS_ALLOW_PRIVATE:-gw-mock,host.docker.internal}
  RUST_LOG: ${RUST_LOG:-info,pacod_gw_core=debug}
  PGW_LOG_FORMAT: ${PGW_LOG_FORMAT:-text}

services:
  core:
    environment:
      PGW_EGRESS_ALLOW_PRIVATE: ${PGW_EGRESS_ALLOW_PRIVATE:-gw-mock,host.docker.internal}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: !override
      - "${PGW_DEV_BIND:-127.0.0.1}:18081:8081"
      - "${PGW_DEV_BIND:-127.0.0.1}:19100:9100"

  gateway-1:
    <<: *dev-gateway
    environment:
      <<: *dev-gateway-env
      PGW_ROLE: gateway
      PGW_INSTANCE_ID: gateway-1
    ports:
      - "${PGW_DEV_BIND:-127.0.0.1}:18082:8080"
      - "${PGW_DEV_BIND:-127.0.0.1}:19101:9100"

  gateway-2:
    <<: *dev-gateway
    environment:
      <<: *dev-gateway-env
      PGW_ROLE: gateway
      PGW_INSTANCE_ID: gateway-2
    ports:
      - "${PGW_DEV_BIND:-127.0.0.1}:18083:8080"
      - "${PGW_DEV_BIND:-127.0.0.1}:19102:9100"

  caddy:
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: !override
      - "${PGW_DEV_BIND:-127.0.0.1}:13000:13000"
      - "${PGW_DEV_BIND:-127.0.0.1}:18080:8088"

  prometheus:
    extra_hosts: ["host.docker.internal:host-gateway"]

  analytics:
    # The price job reads the mock's price list at the address every gateway uses.
    environment:
      PGW_EGRESS_ALLOW_PRIVATE: ${PGW_EGRESS_ALLOW_PRIVATE:-gw-mock,host.docker.internal}
    extra_hosts: ["host.docker.internal:host-gateway"]

  tester:
    environment:
      TESTER_MOCK_URL: ${TESTER_MOCK_URL:-http://gw-mock:9000}
