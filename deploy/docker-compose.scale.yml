# pacod-gw: several gateway instances on one host (docs/runbook.md, section 9).
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.standalone.yml \
#     -f deploy/docker-compose.scale.yml up -d --wait
#
# ("make scale-up"). What it changes:
#   - pacod-gw serves only the management API (role admin), still on pacod-admin-net as
#     pacod-gw-admin; the console, the analytics service and the tester keep calling it there.
#     The gateways stay off pacod-admin-net: they inherit the management instance's networks
#     and its alias otherwise, and the alias would then name them too.
#   - gw-gateway-1 and gw-gateway-2 serve the data plane (role gateway), each with its own spool
#     volume and instance id (gateway-1, gateway-2). More gateways: copy a block, give it the
#     next number, a container name and a volume of its own, an entry in
#     prometheus/targets-scale/gateways.yml and a place in PGW_DATA_UPSTREAMS.
#   - Caddy balances the data plane over the gateways (PGW_DATA_UPSTREAMS); the tester calls
#     them through Caddy as well (http://pacod-caddy:8088).
#   - Prometheus scrapes the gateways too.
#
# Gateways on other machines join with docker-compose.hub.yml and deploy/node/.

x-gateway: &gateway
  extends: { file: docker-compose.yml, service: pacod-gw }
  depends_on:
    gw-preflight: { condition: service_completed_successfully }
    pacod-postgres: { condition: service_healthy, required: false }
    pacod-otel: { condition: service_started, required: false }
    # The management instance applies the migrations and creates the first admin.
    pacod-gw: { condition: service_healthy }

services:
  pacod-gw:
    environment:
      PGW_ROLE: admin
    healthcheck:
      # The admin role has no data plane: its readiness is on the management listener, which
      # listens on the alias, not on 127.0.0.1.
      test: ["CMD", "/usr/local/bin/healthcheck", "http://pacod-gw-admin:8081/readyz"]

  gw-gateway-1:
    <<: *gateway
    # Set again: the one extended from pacod-gw would be inherited.
    container_name: gw-gateway-1
    environment:
      # Set again as well: the log would name the management instance.
      SERVICE_NAME: gw-gateway-1
      PGW_ROLE: gateway
      PGW_INSTANCE_ID: gateway-1
      # The data plane never calls pacod-id: it gets no client secret.
      PGW_ID_CLIENT_SECRET: ""
    volumes: !override
      - gw-spool-1:/var/lib/pacod-gw/spool
    networks: !override [pacod-net]

  gw-gateway-2:
    <<: *gateway
    # Set again: the one extended from pacod-gw would be inherited.
    container_name: gw-gateway-2
    environment:
      # Set again as well: the log would name the management instance.
      SERVICE_NAME: gw-gateway-2
      PGW_ROLE: gateway
      PGW_INSTANCE_ID: gateway-2
      # The data plane never calls pacod-id: it gets no client secret.
      PGW_ID_CLIENT_SECRET: ""
    volumes: !override
      - gw-spool-2:/var/lib/pacod-gw/spool
    networks: !override [pacod-net]

  pacod-caddy:
    environment:
      # Gateways on other machines are added here:
      # "gw-gateway-1:8080 gw-gateway-2:8080 10.0.0.11:8080".
      PGW_DATA_UPSTREAMS: ${PGW_DATA_UPSTREAMS:-gw-gateway-1:8080 gw-gateway-2:8080}
    depends_on:
      gw-gateway-1: { condition: service_healthy }
      gw-gateway-2: { condition: service_healthy }
    networks: [pacod-net, lb]

  gw-tester:
    environment:
      # The data plane as applications see it: balanced over the gateways.
      PGW_CORE_DATA_URL: http://pacod-caddy:8088

  pacod-prometheus:
    volumes:
      - ./prometheus/targets-scale:/etc/prometheus/gw-targets-scale:ro

networks:
  # Caddy's balanced data plane (port 8088) for the load agent of docker-compose.load.yml, which
  # is not on pacod-net. No route out.
  lb:
    internal: true

volumes:
  gw-spool-1:
  gw-spool-2:
