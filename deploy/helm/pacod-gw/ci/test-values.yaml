# Values for "helm lint" and "helm template" in make deploy-check. Every optional part is switched on so
# that all templates are rendered. The secrets are placeholders and must never be used.
image:
  registry: registry.example.com/platform

# Signing in through pacod-id (the subchart "id").
auth: oidc

secrets:
  databaseUrl: postgres://pacod_gw:not-a-real-password@postgres.example.internal:5432/pacod_gw?sslmode=require
  kek: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  kekOld: 2026-01=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  keyPepper: not-a-real-pepper-0123456789
  internalToken: not-a-real-token-0123456789
  adminPassword: not-a-real-password
  clickhousePassword: not-a-real-password
  smtpPassword: not-a-real-password
  uiSessionSecret: not-a-real-session-secret-0123456789abcdef
  loadToken: not-a-real-load-token-0123456789abcdef

core:
  kekId: "2026-10"
  adminEmail: admin@example.com
  otlpEndpoint: http://otel-collector.observability:4318
  egressAllowPrivate:
    - ollama.models.svc.cluster.local
  config: |
    [limits]
    max_body_bytes = 33554432

gateway:
  replicas: 3

clickhouse:
  url: http://clickhouse.example.internal:8123

ingress:
  className: nginx
  api:
    host: api.example.com
    tls:
      secretName: api-example-com-tls
  console:
    host: console.example.com
    tls:
      secretName: console-example-com-tls
  id:
    host: id.example.com
    tls:
      secretName: id-example-com-tls

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
  alertmanagerConfig:
    enabled: true
    emailTo: ops@example.com
    webhookUrl: https://hooks.example.com/pacod-gw

tester:
  mockUrl: http://gw-mock.testing:9000
  loadAgents:
    - name: eu-1
      url: http://10.0.0.21:8096

loadAgent:
  enabled: true
  egress:
    except:
      - 10.0.0.0/16
      - 10.96.0.0/12

loadMock:
  enabled: true

email:
  smtpHost: smtp.example.com
  smtpUsername: gateway@example.com
  fromAddress: gateway@example.com

id:
  image:
    registry: registry.example.com/platform
  secrets:
    databaseUrl: postgres://pacod_id:not-a-real-password@postgres.example.internal:5432/pacod_id?sslmode=require
    kek: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    kekOld: 2026-01=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    tokenPepper: not-a-real-pepper-0123456789
    bootstrapAdminPassword: not-a-real-password
    extra:
      PGW_ID_CLIENT_SECRET: not-a-real-core-secret-0123456789abcdef
      PGW_UI_CLIENT_SECRET: not-a-real-console-secret-0123456789abcdef
      TESTER_ID_CLIENT_SECRET: not-a-real-tester-secret-0123456789abcdef
  kekId: "2026-10"
  email:
    smtpHost: smtp.example.com
    smtpUsername: gateway@example.com
    fromAddress: gateway@example.com
  bootstrapAdmin:
    email: admin@example.com
  serviceMonitor:
    enabled: true
