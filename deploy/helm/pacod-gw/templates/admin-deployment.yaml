{{- $component := dict "root" . "component" "admin" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacod-gw.fullname" . }}-admin
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicas }}
  selector:
    matchLabels:
      {{- include "pacod-gw.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pacod-gw.labels" . | nindent 8 }}
        app.kubernetes.io/component: admin
        {{- with .Values.admin.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $checksums := include "pacod-gw.checksums" . | trim }}
      {{- if or $checksums .Values.admin.podAnnotations }}
      annotations:
        {{- with $checksums }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.admin.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pacod-gw.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      terminationGracePeriodSeconds: 45
      containers:
        - name: admin
          image: {{ include "pacod-gw.image" (dict "root" . "image" .Values.image.core) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "pacod-gw.coreEnv" (dict "root" . "role" "admin") | nindent 12 }}
            {{- if .Values.core.adminEmail }}
            # The first administrator, created when no user exists yet.
            - name: PGW_ADMIN_EMAIL
              value: {{ .Values.core.adminEmail | quote }}
            {{- if not .Values.secrets.mount }}
            - name: PGW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pacod-gw.secretName" . }}
                  key: PGW_ADMIN_PASSWORD
                  optional: true
            {{- end }}
            {{- end }}
            {{- with .Values.email }}
            {{- if .smtpHost }}
            # Account emails: email verification and password reset.
            - name: PGW_SMTP_HOST
              value: {{ .smtpHost | quote }}
            {{- if .smtpPort }}
            - name: PGW_SMTP_PORT
              value: {{ .smtpPort | quote }}
            {{- end }}
            - name: PGW_SMTP_TLS
              value: {{ .smtpTls | default "starttls" | quote }}
            {{- if .smtpUsername }}
            - name: PGW_SMTP_USERNAME
              value: {{ .smtpUsername | quote }}
            {{- if not $.Values.secrets.mount }}
            - name: PGW_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pacod-gw.secretName" $ }}
                  key: PGW_SMTP_PASSWORD
                  optional: true
            {{- end }}
            {{- end }}
            {{- if .fromAddress }}
            - name: PGW_EMAIL_FROM_ADDRESS
              value: {{ .fromAddress | quote }}
            {{- end }}
            - name: PGW_EMAIL_FROM_NAME
              value: {{ .fromName | default "PACOD AI Gateway" | quote }}
            - name: PGW_CONSOLE_URL
              value: {{ .consoleUrl | default (printf "https://%s" $.Values.ingress.console.host) | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http-admin
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          # With the role "admin" the health endpoints are served on the management port.
          startupProbe:
            httpGet:
              path: /readyz
              port: http-admin
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          volumeMounts:
            # The admin role serves no data-plane traffic; its spool only has to exist.
            - name: spool
              mountPath: /var/lib/pacod-gw/spool
            - name: tmp
              mountPath: /tmp
            {{- if .Values.core.config }}
            - name: config
              mountPath: /etc/pacod-gw
              readOnly: true
            {{- end }}
            {{- include "pacod-gw.secretsMount" . | nindent 12 }}
      volumes:
        - name: spool
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.core.config }}
        - name: config
          configMap:
            name: {{ include "pacod-gw.fullname" . }}-config
        {{- end }}
        {{- include "pacod-gw.secretsVolume" . | nindent 8 }}
      {{- with .Values.admin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
