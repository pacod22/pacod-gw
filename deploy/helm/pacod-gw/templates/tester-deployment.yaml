{{- if .Values.tester.enabled }}
{{- $component := dict "root" . "component" "tester" -}}
# The tester: runs the test cases of the console's Testing page against the core. One replica:
# a run lives in the process that started it, and the run history is on one volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacod-gw.fullname" . }}-tester
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: tester
spec:
  replicas: 1
  strategy:
    # The volume is ReadWriteOnce: the old pod lets go of it before the new one starts.
    type: Recreate
  selector:
    matchLabels:
      {{- include "pacod-gw.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pacod-gw.labels" . | nindent 8 }}
        app.kubernetes.io/component: tester
        {{- with .Values.tester.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $checksums := include "pacod-gw.id.checksum" . | trim }}
      {{- if or $checksums .Values.tester.podAnnotations }}
      annotations:
        {{- with $checksums }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.tester.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pacod-gw.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: tester
          image: {{ include "pacod-gw.image" (dict "root" . "image" .Values.image.tester) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # Every run uses the session of the platform admin who started it, checked with the
            # management API; with auth: oidc, a delegated grant of that session, taken at
            # pacod-id with the tester's own client (pacod-gw-tester).
            - name: PGW_CORE_ADMIN_URL
              value: {{ printf "http://%s-admin:%v" (include "pacod-gw.fullname" .) .Values.admin.service.port | quote }}
            - name: PGW_CORE_DATA_URL
              value: {{ printf "http://%s-gateway:%v" (include "pacod-gw.fullname" .) .Values.gateway.service.port | quote }}
            {{- with .Values.tester.mockUrl }}
            - name: TESTER_MOCK_URL
              value: {{ . | quote }}
            - name: TESTER_MOCK_CONTROL_URL
              value: {{ $.Values.tester.mockControlUrl | default . | quote }}
            {{- end }}
            - name: PGW_AUTH
              value: {{ .Values.auth | quote }}
            {{- if .Values.id.enabled }}
            - name: PGW_ID_INTERNAL_URL
              value: {{ include "pacod-gw.id.internalUrl" . | quote }}
            - name: TESTER_ID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pacod-gw.id.secretName" . }}
                  key: TESTER_ID_CLIENT_SECRET
                  {{- if ne .Values.auth "oidc" }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if include "pacod-gw.load.enabled" . }}
            # Load tests: the agents, the token they share, and the mock of the mock target.
            - name: TESTER_LOAD_AGENTS
              value: {{ include "pacod-gw.load.agents" . | quote }}
            - name: TESTER_LOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pacod-gw.secretName" . }}
                  key: TESTER_LOAD_TOKEN
            - name: TESTER_LOAD_LIVE_MAX_CALLS
              value: {{ .Values.tester.loadLiveMaxCalls | quote }}
            - name: TESTER_LOAD_MAX_DURATION
              value: {{ .Values.tester.loadMaxDuration | quote }}
            {{- if .Values.loadMock.enabled }}
            - name: TESTER_LOAD_MOCK_URL
              value: {{ printf "http://%s-load-mock:%v" (include "pacod-gw.fullname" .) .Values.loadMock.service.port | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.tester.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8095
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.tester.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.tester.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pacod-gw.fullname" . }}-tester
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.tester.persistence.size }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      {{- with .Values.tester.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tester.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tester.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
