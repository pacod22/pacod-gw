{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pacod-gw.serviceAccountName" . }}
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# pacod-gw does not call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
