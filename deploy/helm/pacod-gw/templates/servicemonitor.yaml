{{- if .Values.metrics.serviceMonitor.enabled }}
# Scrapes /metrics of every gateway and admin pod (port 9100).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pacod-gw.fullname" . }}
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pacod-gw.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      pacod-gw/metrics: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      # "instance" is the instance id on every series, as in the console: the pod name, which
      # the core also sets on the series that carry their own instance label.
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: instance
{{- end }}
