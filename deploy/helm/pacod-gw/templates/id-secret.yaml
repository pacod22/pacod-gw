{{- if and .Values.id.enabled (not .Values.secrets.existingSecret) }}
{{- $s := .Values.id.secrets }}
# pacod-id's Secret, read by pacod-id (id.secrets.existingSecret names it) and, for the three
# client secrets, by the core, the console and the tester: one value on both sides. Written
# from id.secrets.*, with the gateway's key pepper and SMTP password filled in. With
# secrets.existingSecret set, you provide this Secret too (values.yaml, id.secrets).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pacod-gw.id.secretName" . }}
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: id
type: Opaque
stringData:
  PID_DATABASE_URL: {{ required "id.secrets.databaseUrl is required with id.enabled: pacod-id's own database" $s.databaseUrl | quote }}
  PID_KEK: {{ required "id.secrets.kek is required with id.enabled: openssl rand -base64 32" $s.kek | quote }}
  PID_TOKEN_PEPPER: {{ required "id.secrets.tokenPepper is required with id.enabled: openssl rand -hex 32" $s.tokenPepper | quote }}
  {{- with $s.kekOld }}
  PID_KEK_OLD: {{ . | quote }}
  {{- end }}
  {{- /* The gateway's admin tokens (pgwa_) keep working after the move to pacod-id. */}}
  {{- $legacy := $s.legacyPeppers | default (printf "gw:%s" .Values.secrets.keyPepper) }}
  {{- if ne $legacy "gw:" }}
  PID_LEGACY_PEPPERS: {{ $legacy | quote }}
  {{- end }}
  {{- with $s.smtpPassword | default .Values.secrets.smtpPassword }}
  PID_SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with $s.bootstrapAdminPassword }}
  PID_BOOTSTRAP_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- /* The clients' secrets: pacod-id refuses to start without one, or with a short one. */}}
  {{- range $name := list "PGW_ID_CLIENT_SECRET" "PGW_UI_CLIENT_SECRET" "TESTER_ID_CLIENT_SECRET" }}
  {{- $value := index ($s.extra | default dict) $name | default "" | toString }}
  {{- if lt (len $value) 32 }}
  {{- fail (printf "id.secrets.extra.%s is required with id.enabled and must have at least 32 characters: openssl rand -hex 32" $name) }}
  {{- end }}
  {{- end }}
  {{- range $name, $value := $s.extra }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
