{{- $component := dict "root" . "component" "gateway" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pacod-gw.fullname" . }}-gateway
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  serviceName: {{ include "pacod-gw.fullname" . }}-gateway-headless
  podManagementPolicy: {{ .Values.gateway.podManagementPolicy }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "pacod-gw.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pacod-gw.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
        {{- with .Values.gateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $checksums := include "pacod-gw.checksums" . | trim }}
      {{- if or $checksums .Values.gateway.podAnnotations }}
      annotations:
        {{- with $checksums }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pacod-gw.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
        # The spool volume must be writable by the runtime user.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      containers:
        - name: gateway
          image: {{ include "pacod-gw.image" (dict "root" . "image" .Values.image.core) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "pacod-gw.coreEnv" (dict "root" . "role" "gateway") | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          # /readyz: a configuration snapshot is loaded and the spool is writable.
          # /healthz: the process is alive.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: spool
              mountPath: /var/lib/pacod-gw/spool
            - name: tmp
              mountPath: /tmp
            {{- if .Values.core.config }}
            - name: config
              mountPath: /etc/pacod-gw
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.core.config }}
        - name: config
          configMap:
            name: {{ include "pacod-gw.fullname" . }}-config
        {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: spool
        labels:
          {{- include "pacod-gw.selectorLabels" $component | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.gateway.spool.accessModes | nindent 10 }}
        {{- if .Values.gateway.spool.storageClass }}
        storageClassName: {{ .Values.gateway.spool.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.gateway.spool.size }}
