{{- if or .Values.core.config .Values.core.modelData.modelsFile }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pacod-gw.fullname" . }}-config
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
data:
  {{- with .Values.core.config }}
  gateway.toml: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.core.modelData.modelsFile }}
  models.json: |
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
