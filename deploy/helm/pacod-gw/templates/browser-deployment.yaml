{{- if .Values.scraper.enabled }}
{{- $component := dict "root" . "component" "browser" -}}
# Headless Chromium for the scraper (deploy/docker/browser.Dockerfile; its own flags are in its
# entry point, the deployment's below). Unprivileged, on a read-only root; its sandbox is off (it
# needs capabilities the pod does not have), which the NetworkPolicy makes up for: the browser
# reaches the scraper's proxy and DNS, nothing else, and only the scraper reaches it. A sidecar
# of the scraper would share the scraper's way out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacod-gw.fullname" . }}-browser
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: browser
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pacod-gw.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pacod-gw.labels" . | nindent 8 }}
        app.kubernetes.io/component: browser
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: browser
          image: {{ .Values.scraper.browser.image | default (include "pacod-gw.image" (dict "root" . "image" .Values.image.browser)) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - {{ printf "--proxy-server=http://%s-scraper-proxy:3128" (include "pacod-gw.fullname" .) | quote }}
            - --proxy-bypass-list=<-loopback>
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: devtools
              containerPort: 9222
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: devtools
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: devtools
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.scraper.browser.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
      {{- with .Values.scraper.browser.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scraper.browser.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scraper.browser.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# The browser's DevTools, for the scraper alone (NetworkPolicy).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pacod-gw.fullname" . }}-browser
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: browser
spec:
  type: ClusterIP
  selector:
    {{- include "pacod-gw.selectorLabels" $component | nindent 4 }}
  ports:
    - name: devtools
      port: 9222
      targetPort: devtools
      protocol: TCP
{{- end }}
