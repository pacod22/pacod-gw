{{- if .Values.metrics.prometheusRule.enabled }}
{{- $rules := .Files.Get "files/pacod-gw.rules.yml" | fromYaml }}
# The alert rules of the compose stack (deploy/prometheus/rules/pacod-gw.rules.yml). The
# chart carries a copy in files/; CI fails when the two differ.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "pacod-gw.fullname" . }}
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- toYaml $rules.groups | nindent 4 }}
{{- end }}
