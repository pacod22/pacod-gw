{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pacod-gw.secretName" . }}
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  PGW_KEK: {{ required "secrets.kek is required: openssl rand -base64 32" .Values.secrets.kek | quote }}
  PGW_KEY_PEPPER: {{ required "secrets.keyPepper is required: openssl rand -base64 32" .Values.secrets.keyPepper | quote }}
  {{- if .Values.secrets.kekOld }}
  PGW_KEK_OLD: {{ .Values.secrets.kekOld | quote }}
  {{- end }}
  {{- if .Values.secrets.adminPassword }}
  PGW_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  {{- end }}
  {{- if .Values.analytics.enabled }}
  PGW_INTERNAL_TOKEN: {{ required "secrets.internalToken is required when analytics.enabled: openssl rand -hex 32" .Values.secrets.internalToken | quote }}
  CLICKHOUSE_PASSWORD: {{ required "secrets.clickhousePassword is required when analytics.enabled" .Values.secrets.clickhousePassword | quote }}
  {{- end }}
{{- end }}
