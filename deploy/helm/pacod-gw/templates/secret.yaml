{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pacod-gw.secretName" . }}
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  PGW_KEK: {{ required "secrets.kek is required: openssl rand -base64 32" .Values.secrets.kek | quote }}
  PGW_KEY_PEPPER: {{ required "secrets.keyPepper is required: openssl rand -base64 32" .Values.secrets.keyPepper | quote }}
  {{- if .Values.secrets.kekOld }}
  PGW_KEK_OLD: {{ .Values.secrets.kekOld | quote }}
  {{- end }}
  {{- if .Values.secrets.adminPassword }}
  PGW_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpPassword }}
  PGW_SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.valkeyPassword }}
  PGW_VALKEY_PASSWORD: {{ .Values.secrets.valkeyPassword | quote }}
  {{- end }}
  {{- if and .Values.id.enabled .Values.ui.enabled (or .Values.secrets.uiSessionSecret (eq .Values.auth "oidc")) }}
  {{- $session := required "secrets.uiSessionSecret is required with auth: oidc (the key of the console's session cookie): openssl rand -hex 32" .Values.secrets.uiSessionSecret }}
  {{- if lt (len $session) 32 }}
  {{- fail "secrets.uiSessionSecret must have at least 32 characters: openssl rand -hex 32" }}
  {{- end }}
  PGW_UI_SESSION_SECRET: {{ $session | quote }}
  {{- end }}
  {{- if include "pacod-gw.load.enabled" . }}
  {{- $load := required "secrets.loadToken is required with load tests (loadAgent.enabled or tester.loadAgents): openssl rand -hex 32" .Values.secrets.loadToken }}
  {{- if lt (len $load) 32 }}
  {{- fail "secrets.loadToken must have at least 32 characters: openssl rand -hex 32" }}
  {{- end }}
  TESTER_LOAD_TOKEN: {{ $load | quote }}
  {{- end }}
  {{- if .Values.analytics.enabled }}
  PGW_INTERNAL_TOKEN: {{ required "secrets.internalToken is required when analytics.enabled: openssl rand -hex 32" .Values.secrets.internalToken | quote }}
  CLICKHOUSE_PASSWORD: {{ required "secrets.clickhousePassword is required when analytics.enabled" .Values.secrets.clickhousePassword | quote }}
  {{- end }}
{{- end }}
