{{- if .Values.analytics.enabled }}
{{- $component := dict "root" . "component" "analytics" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacod-gw.fullname" . }}-analytics
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics
spec:
  replicas: {{ .Values.analytics.replicas }}
  selector:
    matchLabels:
      {{- include "pacod-gw.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pacod-gw.labels" . | nindent 8 }}
        app.kubernetes.io/component: analytics
        {{- with .Values.analytics.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $checksums := include "pacod-gw.checksums" . | trim }}
      {{- if or $checksums .Values.analytics.podAnnotations }}
      annotations:
        {{- with $checksums }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.analytics.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pacod-gw.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: analytics
          image: {{ include "pacod-gw.image" (dict "root" . "image" .Values.image.analytics) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: ANALYTICS_LISTEN
              value: "0.0.0.0:8090"
            - name: CLICKHOUSE_URL
              value: {{ required "clickhouse.url is required when analytics.enabled" .Values.clickhouse.url | quote }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pacod-gw.secretName" . }}
                  key: CLICKHOUSE_PASSWORD
            - name: PGW_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pacod-gw.secretName" . }}
                  key: PGW_INTERNAL_TOKEN
            # The core's management API: job leases and results. A job that needs a model (price
            # extraction) asks the core, which makes the call itself.
            - name: PGW_CORE_ADMIN_URL
              value: {{ printf "http://%s-admin:%v" (include "pacod-gw.fullname" .) .Values.admin.service.port | quote }}
            {{- if .Values.core.egressAllowPrivate }}
            # What the price job may fetch besides public addresses: the core's list.
            - name: PGW_EGRESS_ALLOW_PRIVATE
              value: {{ join "," .Values.core.egressAllowPrivate | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.analytics.logLevel | quote }}
            - name: ANALYTICS_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            {{- with .Values.analytics.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.analytics.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.analytics.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.analytics.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.analytics.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
