{{- if .Values.networkPolicy.enabled }}
{{- $gateway := include "pacod-gw.selectorLabels" (dict "root" . "component" "gateway") }}
{{- $admin := include "pacod-gw.selectorLabels" (dict "root" . "component" "admin") }}
{{- $analytics := include "pacod-gw.selectorLabels" (dict "root" . "component" "analytics") }}
{{- $ui := include "pacod-gw.selectorLabels" (dict "root" . "component" "ui") }}
{{- $tester := include "pacod-gw.selectorLabels" (dict "root" . "component" "tester") }}
{{- $loadAgent := include "pacod-gw.selectorLabels" (dict "root" . "component" "load-agent") }}
{{- $loadMock := include "pacod-gw.selectorLabels" (dict "root" . "component" "load-mock") }}
# The management API: reachable by the console, the analytics service and the tester, and by
# nothing else. The metrics port is open to the scrapers named in networkPolicy.metricsFrom.
{{- if .Values.id.enabled }}
#
# These policies restrict incoming traffic only, so the core, the console and the tester reach
# pacod-id's internal listener (8071) without a rule here. pacod-id's own policy (the subchart's,
# id.networkPolicy) lets them in: id.networkPolicy.internalFrom selects their pods.
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacod-gw.fullname" . }}-admin
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  podSelector:
    matchLabels:
      {{- $admin | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $ui | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- $analytics | nindent 14 }}
        {{- if .Values.tester.enabled }}
        - podSelector:
            matchLabels:
              {{- $tester | nindent 14 }}
        {{- end }}
        {{- with .Values.networkPolicy.adminExtraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http-admin
          protocol: TCP
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
{{- if .Values.analytics.enabled }}
---
# The analytics service: reachable by the core (gateway and admin pods) and by nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacod-gw.fullname" . }}-analytics
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics
spec:
  podSelector:
    matchLabels:
      {{- $analytics | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $gateway | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- $admin | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
---
# The gateway pods: the data plane is open (the Ingress controller and in-cluster
# applications call it); the metrics port is open to the scrapers only. Nothing else is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacod-gw.fullname" . }}-gateway
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      {{- $gateway | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
{{- if .Values.tester.enabled }}
---
# The tester: reachable by the console and by nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacod-gw.fullname" . }}-tester
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: tester
spec:
  podSelector:
    matchLabels:
      {{- $tester | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $ui | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
{{- if .Values.loadAgent.enabled }}
---
# The load agent: reachable by the tester only. Unlike the other components its outgoing
# traffic is restricted too: a load test may name any URL as its target, so the agent reaches
# DNS, the gateway pods and loadAgent.egress, and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacod-gw.fullname" . }}-load-agent
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: load-agent
spec:
  podSelector:
    matchLabels:
      {{- $loadAgent | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $tester | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- $gateway | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
    - to:
        - ipBlock:
            cidr: {{ .Values.loadAgent.egress.cidr | quote }}
            {{- with .Values.loadAgent.egress.except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
{{- if .Values.loadMock.enabled }}
---
# The mock provider of load tests: reachable by the gateway pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pacod-gw.fullname" . }}-load-mock
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: load-mock
spec:
  podSelector:
    matchLabels:
      {{- $loadMock | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $gateway | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
{{- end }}
