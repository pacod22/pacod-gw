{{- if .Values.ui.enabled }}
{{- $component := dict "root" . "component" "ui" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacod-gw.fullname" . }}-ui
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "pacod-gw.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pacod-gw.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $checksums := include "pacod-gw.id.checksum" . | trim }}
      {{- if and .Values.id.enabled (not .Values.secrets.existingSecret) }}
      {{- /* The session key comes from the chart's Secret. */}}
      {{- $checksums = printf "%s\nchecksum/secret: %s" $checksums (include (print $.Template.BasePath "/secret.yaml") . | sha256sum) | trim }}
      {{- end }}
      {{- if or $checksums .Values.ui.podAnnotations }}
      annotations:
        {{- with $checksums }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pacod-gw.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        # The user "node" of the console image.
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: ui
          image: {{ include "pacod-gw.image" (dict "root" . "image" .Values.image.ui) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # The management API. Called from the server side of the console only.
            - name: GATEWAY_API_URL
              value: {{ printf "http://%s-admin:%v" (include "pacod-gw.fullname" .) .Values.admin.service.port | quote }}
            # adapter-node 6 has no ORIGIN variable: the origin is the Host header plus the
            # protocol header, both of which the ingress controller must pass.
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: ADDRESS_HEADER
              value: x-forwarded-for
            - name: XFF_DEPTH
              value: {{ .Values.ui.xffDepth | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            {{- with .Values.ui.prometheusUrl }}
            # Prometheus, for the Metrics page. Called from the server side of the console only.
            - name: PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ui.grafanaUrl }}
            # Grafana, for a link on the Monitoring page. The console never calls it.
            - name: GRAFANA_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.tester.enabled }}
            # The tester, for the Testing page. Called from the server side of the console only.
            - name: TESTER_URL
              value: {{ printf "http://%s-tester:%v" (include "pacod-gw.fullname" .) .Values.tester.service.port | quote }}
            {{- end }}
            # Who signs people in: local (the console's own login against the core) or oidc
            # (pacod-id). The core's setting is the same value.
            - name: PGW_AUTH
              value: {{ .Values.auth | quote }}
            {{- if .Values.id.enabled }}
            # pacod-id, read only with auth: oidc. The console is the confidential client
            # pacod-gw-console; its secret is in pacod-id's Secret, its session key in the
            # chart's Secret.
            - name: PGW_ID_ISSUER
              value: {{ include "pacod-gw.id.issuer" . | quote }}
            - name: PGW_ID_INTERNAL_URL
              value: {{ include "pacod-gw.id.internalUrl" . | quote }}
            - name: PGW_UI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pacod-gw.id.secretName" . }}
                  key: PGW_UI_CLIENT_SECRET
                  {{- if ne .Values.auth "oidc" }}
                  optional: true
                  {{- end }}
            - name: PGW_UI_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pacod-gw.secretName" . }}
                  key: PGW_UI_SESSION_SECRET
                  {{- if ne .Values.auth "oidc" }}
                  optional: true
                  {{- end }}
            # The console's own address, as the redirect URIs in id.config have it.
            - name: PGW_CONSOLE_URL
              value: {{ printf "https://%s" .Values.ingress.console.host | quote }}
            {{- end }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # The forwarded headers are sent because ADDRESS_HEADER makes them mandatory. A
          # redirect to the login page counts as success.
          startupProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: 127.0.0.1
                - name: X-Forwarded-Proto
                  value: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: X-Forwarded-For
                  value: 127.0.0.1
                - name: X-Forwarded-Proto
                  value: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
