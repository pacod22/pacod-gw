{{- if .Values.loadMock.enabled }}
{{- $component := dict "root" . "component" "load-mock" -}}
# The mock provider behind load tests against "the mock": the gateway calls it, nothing else
# does (networkpolicy.yaml). It keeps no requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacod-gw.fullname" . }}-load-mock
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: load-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pacod-gw.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pacod-gw.labels" . | nindent 8 }}
        app.kubernetes.io/component: load-mock
    spec:
      serviceAccountName: {{ include "pacod-gw.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: load-mock
          image: {{ include "pacod-gw.image" (dict "root" . "image" .Values.image.mock) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--listen", "0.0.0.0:9000", "--max-captured", "0"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.loadMock.resources | nindent 12 }}
      {{- with .Values.loadMock.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loadMock.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loadMock.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
