{{- if .Values.loadAgent.enabled }}
# The load agent, as the tester reaches it. Internal only.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pacod-gw.fullname" . }}-load-agent
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: load-agent
spec:
  type: ClusterIP
  selector:
    {{- include "pacod-gw.selectorLabels" (dict "root" . "component" "load-agent") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.loadAgent.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
