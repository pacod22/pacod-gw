{{- $component := dict "root" . "component" "gateway" -}}
# The data plane, as the Ingress and in-cluster applications reach it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pacod-gw.fullname" . }}-gateway
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "pacod-gw.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
---
# Gives every gateway pod a stable DNS name and exposes the metrics port for scraping.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pacod-gw.fullname" . }}-gateway-headless
  labels:
    {{- include "pacod-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
    pacod-gw/metrics: "true"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "pacod-gw.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
