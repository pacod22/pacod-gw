# Values of the pacod-gw chart.
#
# The chart deploys these workloads:
#   gateway    the core with role "gateway": the data plane (8080). A StatefulSet, because
#              every instance owns an event spool on a persistent volume.
#   admin      the core with role "admin": the management API (8081). Internal.
#   analytics  the analytics service (8090). Internal.
#   ui         the admin console (3000).
#   tester     the test engine behind the console's Testing page (8095). Internal.
#   load-agent, load-mock   load tests, off by default (loadAgent, loadMock). Internal.
# and, as the subchart "id" (values id.*, below), pacod-id: sign-in, people and roles.
#
# PostgreSQL, ClickHouse and Valkey are not part of the chart. Point the chart at existing ones
# (secrets.databaseUrl, id.secrets.databaseUrl, clickhouse.* and core.valkeyUrl).

nameOverride: ""
fullnameOverride: ""

image:
  # Registry and path in front of the image names, without a trailing slash, for example
  # "registry.example.com/platform". Empty: the bare names below.
  registry: ""
  # Tag of the four images. Empty: the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  core:
    repository: pacod-gw-core
  analytics:
    repository: pacod-gw-analytics
  ui:
    repository: pacod-gw-ui
  tester:
    repository: pacod-gw-tester
  # Load tests only (loadAgent, loadMock).
  loadAgent:
    repository: pacod-gw-load-agent
  mock:
    repository: pacod-gw-mock

imagePullSecrets: []

# Who signs people in to the console: "local" (the gateway itself) or "oidc" (pacod-id, which
# needs id.enabled). Passed as PGW_AUTH to the core's admin role, the console and the tester.
# pacod-id runs either way, so that a gateway's people can be moved to it first (docs/runbook.md
# of the gateway, and vendor/pacod-id/docs/runbook.md); then switch to oidc.
auth: local

# Log format of the core, the analytics service and the load agent (pacod-demo/docs/LOGGING.md):
# json (one JSON object per line) or text (one readable line per event). Anything else is json.
logFormat: json

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------------------------
secrets:
  # Name of an existing Secret to use instead of creating one. It must hold these keys:
  #   DATABASE_URL          PostgreSQL connection URL, password included
  #   PGW_KEK               key-encryption key, base64 of 32 bytes
  #   PGW_KEY_PEPPER        HMAC pepper for gateway keys, at least 16 characters
  #   PGW_INTERNAL_TOKEN    shared secret between core and analytics, at least 16 characters
  #   CLICKHOUSE_PASSWORD   password of the ClickHouse user (when analytics.enabled)
  # and may hold:
  #   PGW_KEK_OLD           earlier key-encryption keys, "id=base64key,id=base64key"
  #   PGW_ADMIN_PASSWORD    password of the first administrator
  #   PGW_SMTP_PASSWORD     password of the SMTP account (email.smtpUsername)
  #   PGW_UI_SESSION_SECRET key of the console's session cookie (required with auth: oidc)
  #   TESTER_LOAD_TOKEN     the token of the tester and the load agents (required with load tests)
  # When it is set, the values below are ignored, and pacod-id's Secret (id.secrets) is yours to
  # provide as well.
  existingSecret: ""

  # true: the core reads these secrets from the Secret mounted as files
  # (/var/run/secrets/pacod-gw, named by PGW_SECRETS_DIR) instead of from environment
  # variables, so they are not in the process environment. A key missing from the Secret
  # counts as unset. The analytics service keeps reading its two from the environment.
  mount: false

  # postgres://user:password@host:5432/database?sslmode=require
  # Only the core connects to PostgreSQL. It creates and migrates its schema at start.
  databaseUrl: ""
  # openssl rand -base64 32. Provider credentials are encrypted under this key. Keep a copy
  # outside the cluster and outside the database backups: without it they are unreadable.
  kek: ""
  # Earlier keys, kept while a rotation is under way: "id=base64key,id=base64key".
  kekOld: ""
  # openssl rand -base64 32. Changing it invalidates every gateway key and admin token.
  keyPepper: ""
  # openssl rand -hex 32
  internalToken: ""
  # Password of the first administrator (core.adminEmail). Used once, when no user exists.
  adminPassword: ""
  # Password of clickhouse.user.
  clickhousePassword: ""
  # Password of the response cache's Valkey (core.valkeyUrl), when it asks for one.
  valkeyPassword: ""
  # Password of the SMTP account named in email.smtpUsername.
  smtpPassword: ""
  # openssl rand -hex 32 (at least 32 characters). The key of the console's session cookie
  # with auth: oidc; changing it signs everyone out of the console. Not given to pacod-id.
  uiSessionSecret: ""
  # openssl rand -hex 32 (at least 32 characters). The token the tester and the load agents
  # share; required with loadAgent.enabled or tester.loadAgents. Agents on other machines get
  # the same value (LOAD_AGENT_TOKEN).
  loadToken: ""

# ---------------------------------------------------------------------------------------------
# Account emails: email verification and password reset, sent by the admin role
# ---------------------------------------------------------------------------------------------
email:
  # SMTP server. Empty: no email is sent; new users need no verification and an
  # administrator resets forgotten passwords.
  smtpHost: ""
  # Empty: 587 for starttls, 465 for tls, 25 for none.
  smtpPort: ""
  # starttls (required upgrade), tls (TLS from the first byte) or none (local relay only).
  smtpTls: starttls
  smtpUsername: ""
  # Sender address. Empty: the SMTP username, when it is an address.
  fromAddress: ""
  fromName: pacod-gw
  # The console's address as users reach it, for the links in the emails.
  # Empty: https://<ingress.console.host>.
  consoleUrl: ""

# ---------------------------------------------------------------------------------------------
# Settings shared by the gateway and the admin role (both run the core image)
# ---------------------------------------------------------------------------------------------
core:
  # Name stored with every record encrypted under secrets.kek. Change it when the key changes.
  kekId: default
  # E-mail address of the first administrator, created when no user exists yet.
  adminEmail: ""
  # OTLP over HTTP endpoint for traces, for example http://otel-collector.observability:4318.
  # Empty: no traces are exported.
  otlpEndpoint: ""
  # Hosts or CIDR ranges on private networks where providers may live, for example an Ollama
  # service in the cluster. Everything else that is private or link-local is refused. The
  # analytics service gets the same list: it applies to the sources of the price job.
  egressAllowPrivate: []
  # Load balancers whose X-Forwarded-For the gateways believe, so that the bad-key throttle
  # sees the client and not the ingress controller: addresses, CIDR ranges or private_ranges.
  # Empty: the peer address counts.
  trustedProxies:
    - private_ranges
  # Log level: debug, info, warn or error, or a tracing-subscriber filter
  # (info,pacod_gw_core=debug). Anything else is info.
  logLevel: info
  # Optional content of the bootstrap file (config/gateway.example.toml lists the sections).
  # Mounted read-only and named in PGW_CONFIG. Environment variables set by this chart win.
  config: ""
  # The response cache's store (docs/plugin-concept.md, section 15), shared by the gateways:
  # rediss://valkey.example.internal:6380/0, with TLS, unless Valkey runs beside the pods
  # (redis:// is for a connection that crosses no network others read; the core warns
  # otherwise). Its password is secrets.valkeyPassword. Answers arrive there sealed with a key
  # derived from PGW_KEK. Configure it without persistence and with maxmemory-policy
  # allkeys-lru. Empty: every gateway pod keeps answers in its own memory (64 MiB).
  valkeyUrl: ""
  # For a Valkey certificate of an authority of your own: the PEM file of that authority as the
  # pods see it, for example a key of the mounted Secret (secrets.mount) such as
  # /var/run/secrets/pacod-gw/VALKEY_CA_PEM. Empty: the image's system authorities.
  valkeyCaFile: ""
  # The mode the response cache is installed with on the first start against a new database:
  # "off", "shadow" or "enforce" (quoted: YAML reads a bare off as false). Afterwards it is
  # changed in the console.
  cacheDefaultMode: "off"
  # Extra environment variables for both roles, as a list of {name, value} entries.
  extraEnv: []

# ---------------------------------------------------------------------------------------------
# Gateway: the data plane
# ---------------------------------------------------------------------------------------------
gateway:
  # Instances share nothing but PostgreSQL, and Valkey with core.valkeyUrl. A configuration
  # change reaches every instance within about two seconds; limits are enforced with a lag of
  # at most one second.
  replicas: 2
  # Start and stop instances in parallel; they do not depend on each other.
  podManagementPolicy: Parallel
  # Connections each gateway keeps to PostgreSQL. Empty: 4. With N gateways and the admin
  # pods, PostgreSQL must accept about N x 4 + 10 x admin.replicas + a few for maintenance.
  dbMaxConnections: ""
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  # The event spool. Size it above the spool caps of the core: 1 GiB for usage events plus
  # 4 GiB for audit-mode records unless core.config changes [spool].
  spool:
    size: 8Gi
    # Empty: the cluster's default storage class.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  # Longer than the core's drain time (30 s), so that running streams can finish.
  terminationGracePeriodSeconds: 60
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

# ---------------------------------------------------------------------------------------------
# Admin: the management API
# ---------------------------------------------------------------------------------------------
admin:
  # One is enough; two give a rolling restart without a gap for the console.
  replicas: 1
  # Connections each admin pod keeps to PostgreSQL. Empty: 10.
  dbMaxConnections: ""
  service:
    type: ClusterIP
    port: 8081
    annotations: {}
  # The admin pods' event spool, an emptyDir: usage events of playground calls and of settled
  # message batches wait there until they are shipped, seconds later. The limit must stay above
  # the spool caps of core.config ([spool], 1 GiB + 4 GiB by default), or a pod whose analytics
  # service is down long enough is evicted before the spool refuses events.
  spoolSizeLimit: 6Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------------------------
# Analytics
# ---------------------------------------------------------------------------------------------
analytics:
  # false gives the minimal setup: no reports, no audit mode, no price tracker.
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
    port: 8090
    annotations: {}
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  logLevel: info
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The external ClickHouse the analytics service writes to. It creates the database and
# migrates its tables at start.
clickhouse:
  # HTTP interface, for example http://clickhouse.example.internal:8123
  url: ""
  database: pacod_gw
  user: pacod_gw

# ---------------------------------------------------------------------------------------------
# Admin console
# ---------------------------------------------------------------------------------------------
ui:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  # How many proxies add an address to X-Forwarded-For before a request reaches the console.
  # 1 for an ingress controller that faces the clients directly; one more for every trusted
  # load balancer in front of it.
  xffDepth: 1
  # The Prometheus server that scrapes the gateway (for example the one the ServiceMonitor
  # feeds), such as http://prometheus-operated.monitoring:9090. The console's Metrics page
  # queries it; empty leaves the page saying that it is not set up.
  prometheusUrl: ""
  # Grafana as the browser reaches it, such as https://console.example.com/grafana/. The
  # Monitoring page links to it; empty hides the link.
  grafanaUrl: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------------------------
# Tester: runs test cases against the gateway, for platform admins, from the console's Testing
# page. It has no secret of its own and no Ingress; only the console calls it.
# ---------------------------------------------------------------------------------------------
tester:
  enabled: true
  service:
    port: 8095
  # A scripted mock provider for mock mode, as the gateway reaches it. Empty (the default):
  # only live mode, with models that are already set up, is offered.
  mockUrl: ""
  # The mock as the tester reaches it, to script failures. Empty: the same as mockUrl.
  mockControlUrl: ""
  # Load agents on other machines (deploy/load-agent/), besides the chart's own (loadAgent):
  #   - name: eu-1
  #     url: http://10.0.0.21:8096
  # The tester must be able to reach them: the policies here restrict incoming traffic only.
  loadAgents: []
  # The most calls a load test against a live model may make, and the longest a load test
  # lasts (seconds).
  loadLiveMaxCalls: 1000
  loadMaxDuration: 3600
  persistence:
    # Keeps the run history and the uploaded suites across restarts. Off: an emptyDir.
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------------------------
# Load tests (docs/testing.md, section 9). A load agent makes load on request, so it is off
# by default. Agents in the cluster share the gateway's nodes: for figures of capacity, use
# agents on other machines (tester.loadAgents) as well.
# ---------------------------------------------------------------------------------------------
loadAgent:
  enabled: false
  service:
    port: 8096
  # The gateway as the agent reaches it. Empty: the gateway Service.
  targetUrl: ""
  # The most it makes, whatever a test asks for.
  maxConcurrency: 10000
  maxRate: 5000
  maxDuration: 3600
  # Where the agent may connect: DNS, the gateway pods, and this range. A load test may name any
  # URL as its target (an external gateway), so list your pod and service ranges in "except" to
  # keep in-cluster services out of its reach.
  egress:
    cidr: 0.0.0.0/0
    except: []
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: "2"
      memory: 512Mi
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The mock provider behind load tests against "the mock" (it never serves real traffic). Its
# Service name is added to the core's egress allow-list.
loadMock:
  enabled: false
  service:
    port: 9000
  resources:
    requests:
      cpu: 100m
      memory: 32Mi
    limits:
      cpu: "2"
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------------------------
# Ingress: the API host serves the data plane, the console host serves the console.
# The management API and the analytics service get no Ingress.
# ---------------------------------------------------------------------------------------------
ingress:
  enabled: true
  className: ""
  api:
    # Applications use https://<host>/v1, /gw/v1 and /proxy.
    host: api.example.com
    # The defaults are for ingress-nginx; other controllers ignore them and need their own.
    # The data plane streams server-sent events and takes bodies of tens of megabytes, so
    # the controller must not buffer and must not cut a call that runs for minutes.
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-body-size: 64m
      nginx.ingress.kubernetes.io/proxy-read-timeout: "660"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "660"
    tls:
      # Name of the TLS Secret for the host. Empty: no tls section is rendered.
      secretName: ""
  console:
    host: console.example.com
    # The console builds its origin from the Host header and X-Forwarded-Proto. The
    # controller must pass Host unchanged and set X-Forwarded-Proto and X-Forwarded-For;
    # ingress-nginx does. Otherwise the login form is rejected.
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-body-size: 16m
    tls:
      secretName: ""
  id:
    # pacod-id's public listener, where people sign in (with id.enabled). https://<host> is the
    # issuer of the gateway's realm: id.config must say so (id.extraEnv, PGW_ID_HOST), and the
    # chart refuses to render when it does not.
    host: id.example.com
    annotations: {}
    tls:
      secretName: ""

# ---------------------------------------------------------------------------------------------
# Network policies. They need a network plugin that enforces them.
# ---------------------------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # Who may scrape the metrics port (9100) of the gateway and admin pods. The default allows
  # every pod in the cluster; narrow it to the namespace of your Prometheus, for example
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  metricsFrom:
    - namespaceSelector: {}
  # Extra peers that may call the management API, besides the console, the analytics
  # service and the tester. For example the pods of an ingress controller, if you expose it yourself.
  adminExtraFrom: []

# ---------------------------------------------------------------------------------------------
# Prometheus Operator objects. Both need the operator's CRDs in the cluster.
# ---------------------------------------------------------------------------------------------
metrics:
  serviceMonitor:
    enabled: false
    interval: 15s
    scrapeTimeout: 10s
    # Labels your Prometheus selects ServiceMonitors by, for example release: kube-prometheus-stack.
    labels: {}
  prometheusRule:
    # The alert rules of deploy/prometheus/rules/pacod-gw.rules.yml (files/ holds a copy).
    enabled: false
    labels: {}
  # Delivery of the alerts by the Alertmanager of the Prometheus Operator: an
  # AlertmanagerConfig with an email receiver (the SMTP account of email.*, its password from
  # the Secret's PGW_SMTP_PASSWORD) and an optional webhook.
  alertmanagerConfig:
    enabled: false
    # Labels your Alertmanager selects AlertmanagerConfigs by.
    labels: {}
    # Where alerts are sent by email. Empty: no email.
    emailTo: ""
    # An HTTP endpoint that receives the alerts as JSON. Empty: none.
    webhookUrl: ""

# Security contexts. The core and analytics images run as user 65532 without a shell; the
# console image runs as user 1000 (node).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------------------------
# pacod-id: the subchart "id" (vendor/pacod-id/deploy/helm/pacod-id; its values.yaml lists every
# setting, and vendor/pacod-id/docs/runbook.md section 7 explains them). What is set here is
# what the gateway needs from it, or what differs from its defaults.
#
# The subchart sees only id.*, and takes its values literally: nothing below can be derived
# from the gateway's settings above. Where they must agree, either this chart fills it in (the
# Secret) or refuses to render when they differ (the host names in id.config), or the comment
# says to set both (the mail settings, the selector of the network policy).
# ---------------------------------------------------------------------------------------------
id:
  # false: no pacod-id, and auth must be local.
  enabled: true

  # The objects are named <release>-pacod-id and <release>-pacod-id-internal, and the pods are
  # labelled app.kubernetes.io/name: pacod-id. (Under the alias "id" alone, a release name
  # containing "id" would give pacod-id the gateway's own object names.)
  nameOverride: pacod-id

  image:
    # registry.example.com/platform; empty: the bare name. Tag: the subchart's appVersion.
    registry: ""
    repository: pacod-id
    tag: ""

  # The gateway's realm and its three clients, as in deploy/pacod-id/pacod-id.toml. pacod-id
  # fills in ${NAME} from its environment (id.extraEnv): the host names. The clients' secrets
  # come from the variables their secret_env names, which are keys of the Secret below.
  config: |
    [[realm]]
    name = "gateway"
    issuer = "https://${PGW_ID_HOST}"
    brand = "gateway"
    # Platform admins manage the people who sign in to the console (the users page).
    accounts_managed_by = ["gw.platform_admin"]

    # The console: a confidential client, with sign-in and sign-out back to its own address.
    [[client]]
    id = "pacod-gw-console"
    realm = "gateway"
    kind = "confidential"
    secret_env = "PGW_UI_CLIENT_SECRET"
    redirect_uris = ["https://${PGW_CONSOLE_HOST}/auth/callback"]
    post_logout_redirect_uris = ["https://${PGW_CONSOLE_HOST}/"]
    initiate_login_uri = "https://${PGW_CONSOLE_HOST}/auth/login"
    audience = "pacod-gw"

    # The core: pushes the gateway's roles, registers its organisations and workspaces, follows
    # the feed, and acts for the console's caller in the identity pages (token exchange).
    [[client]]
    id = "pacod-gw-core"
    realm = "gateway"
    kind = "service"
    product = "gw"
    secret_env = "PGW_ID_CLIENT_SECRET"
    audience = "pacod-gw"

    # The tester: a test run works with a delegated grant of the admin's session.
    [[client]]
    id = "pacod-gw-tester"
    realm = "gateway"
    kind = "service"
    secret_env = "TESTER_ID_CLIENT_SECRET"
    audience = "pacod-gw"

  # The host names id.config uses. They must be ingress.id.host and ingress.console.host; the
  # chart refuses to render otherwise. When you add variables, keep these two in the list.
  extraEnv:
    - name: PGW_ID_HOST
      value: id.example.com
    - name: PGW_CONSOLE_HOST
      value: console.example.com

  # pacod-id's secrets. This chart writes them, with the clients' secrets, into ONE Secret named
  # by existingSecret (the subchart's option for a Secret it does not create). pacod-id reads
  # it, mounted as files; the core, the console and the tester read their client secret from
  # the same Secret, so the two sides cannot differ. The name is fixed, not derived from the
  # release: give each release in one namespace its own.
  #
  # With secrets.existingSecret set, this chart writes neither Secret: create this one yourself
  # with the keys PID_DATABASE_URL, PID_KEK, PID_TOKEN_PEPPER, PGW_ID_CLIENT_SECRET,
  # PGW_UI_CLIENT_SECRET, TESTER_ID_CLIENT_SECRET, and as needed PID_KEK_OLD,
  # PID_LEGACY_PEPPERS ("gw:<PGW_KEY_PEPPER>"), PID_SMTP_PASSWORD, PID_BOOTSTRAP_ADMIN_PASSWORD.
  #
  # pacod-id reads its secrets only at start, and its pods do not restart when this Secret
  # changes (the core, the console and the tester do):
  #   kubectl rollout restart deployment/<release>-pacod-id
  secrets:
    existingSecret: pacod-id-secrets
    # Files, not variables (the subchart's default).
    mount: true
    # postgres://pacod_id:password@host:5432/pacod_id?sslmode=require. A role and database of
    # pacod-id's own, not the gateway's; it migrates its schema at start.
    databaseUrl: ""
    # openssl rand -base64 32. pacod-id's signing keys are sealed under it: keep a copy outside
    # the cluster, like secrets.kek. Its id is id.kekId.
    kek: ""
    kekOld: ""
    # openssl rand -hex 32
    tokenPepper: ""
    # Empty: "gw:<secrets.keyPepper>", so that the gateway's admin tokens (pgwa_) keep working.
    legacyPeppers: ""
    # Empty: secrets.smtpPassword.
    smtpPassword: ""
    # The first administrator's password (bootstrapAdmin below), at least 12 characters.
    bootstrapAdminPassword: ""
    # The clients' secrets, by the names id.config gives them. Required, each at least 32
    # characters (openssl rand -hex 32): pacod-id does not start without them, whatever auth is.
    extra:
      PGW_ID_CLIENT_SECRET: ""
      PGW_UI_CLIENT_SECRET: ""
      TESTER_ID_CLIENT_SECRET: ""

  kekId: default

  # pacod-id's mail (verification, password reset, invitations, new-sign-in notices) goes
  # through the gateway's mail account: set these to the values of email.* above. The password
  # is filled in from secrets.smtpPassword. Unlike the gateway, fromAddress is required with
  # smtpHost. Empty smtpHost: pacod-id sends no mail.
  email:
    smtpHost: ""
    smtpPort: ""
    smtpTls: starttls
    smtpUsername: ""
    fromAddress: ""
    fromName: pacod-gw

  # The first administrator, on a NEW installation only: a platform admin of the gateway with
  # this address and id.secrets.bootstrapAdminPassword. Leave it empty when an existing
  # gateway's people are moved to pacod-id (they are imported; the gateway's runbook), and empty
  # it again once the account exists.
  bootstrapAdmin:
    email: ""
    realm: gateway
    roles: gw.platform_admin

  # The proxies whose X-Forwarded-For pacod-id believes (PID_TRUSTED_PROXIES): the Ingress
  # controller's pods. As core.trustedProxies.
  trustedProxies: private_ranges

  # This chart's ingress.id routes the id host; the subchart's own Ingress stays off.
  ingress:
    enabled: false

  networkPolicy:
    enabled: true
    # The internal listener (8071): the core's admin pods, the console and the tester. The
    # selector cannot name the release, so it takes every pacod-gw pod with these components in
    # the namespace. With nameOverride set, change app.kubernetes.io/name to match.
    internalFrom:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: pacod-gw
          matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values: [admin, ui, tester]
    # The public listener (8070). Empty: from anywhere (the Ingress controller).
    publicFrom: []
    # The metrics port (9170), as networkPolicy.metricsFrom above.
    metricsFrom:
      - namespaceSelector: {}

  serviceMonitor:
    enabled: false
