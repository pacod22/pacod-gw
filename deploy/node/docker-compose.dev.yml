# A gateway that plays another machine, for development (make node-dev-up):
#
#   docker compose -p pacod-gw-node-dev -f deploy/node/docker-compose.yml \
#     -f deploy/node/docker-compose.dev.yml up -d --build --wait
#
# It shares no Docker network with the development stack: like a gateway on another machine
# it reaches PostgreSQL, the analytics service and the trace collector only through the ports
# the development stack publishes on the host, at host.docker.internal. Its own ports:
#
#   data plane   18180   (add host.docker.internal:18180 to Caddy's PGW_DATA_UPSTREAMS)
#   metrics      19180   (add it to deploy/prometheus/targets/nodes.yml, instance "node-1")
#
# The secrets are the development defaults of docker-compose.dev.yml: public, never for
# anything reachable by others.

services:
  preflight:
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://pacod_gw:pacod_gw_dev_postgres@host.docker.internal:15433/pacod_gw}
      PGW_INSTANCE_ID: ${PGW_INSTANCE_ID:-node-1}
      PGW_KEK: ${PGW_KEK:-ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=}
      PGW_KEY_PEPPER: ${PGW_KEY_PEPPER:-dev-only-pepper-do-not-use-in-prod}
      PGW_INTERNAL_TOKEN: ${PGW_INTERNAL_TOKEN:-dev-only-internal-token-0123456789}
      PGW_ANALYTICS_URL: ${PGW_ANALYTICS_URL:-http://host.docker.internal:18090}
      PGW_TRUSTED_PROXIES: ${PGW_TRUSTED_PROXIES:-private_ranges}

  gateway:
    image: pacod-gw-core:dev
    build:
      context: ../..
      dockerfile: deploy/docker/rust.Dockerfile
      target: core
    hostname: ${PGW_NODE_HOSTNAME:-node-1}
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      PGW_INSTANCE_ID: ${PGW_INSTANCE_ID:-node-1}
      DATABASE_URL: ${DATABASE_URL:-postgres://pacod_gw:pacod_gw_dev_postgres@host.docker.internal:15433/pacod_gw}
      PGW_KEK: ${PGW_KEK:-ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=}
      PGW_KEK_ID: ${PGW_KEK_ID:-dev}
      PGW_KEY_PEPPER: ${PGW_KEY_PEPPER:-dev-only-pepper-do-not-use-in-prod}
      PGW_INTERNAL_TOKEN: ${PGW_INTERNAL_TOKEN:-dev-only-internal-token-0123456789}
      PGW_ANALYTICS_URL: ${PGW_ANALYTICS_URL:-http://host.docker.internal:18090}
      PGW_OTLP_ENDPOINT: ${PGW_OTLP_ENDPOINT:-http://host.docker.internal:14318}
      PGW_TRUSTED_PROXIES: ${PGW_TRUSTED_PROXIES:-private_ranges}
      # The mock provider is registered as http://host.docker.internal:19000 so that every
      # gateway, here and in the development stack, reaches it.
      PGW_EGRESS_ALLOW_PRIVATE: ${PGW_EGRESS_ALLOW_PRIVATE:-host.docker.internal}
      RUST_LOG: ${RUST_LOG:-info,pacod_gw_core=debug}
      PGW_LOG_FORMAT: ${PGW_LOG_FORMAT:-text}
    ports: !override
      - "127.0.0.1:${PGW_NODE_DATA_PORT:-18180}:8080"
      - "127.0.0.1:${PGW_NODE_METRICS_PORT:-19180}:9100"
