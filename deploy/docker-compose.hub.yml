# pacod-gw: the central host for gateways on other machines (docs/runbook.md, section 9).
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.standalone.yml \
#     [-f deploy/docker-compose.scale.yml] -f deploy/docker-compose.hub.yml up -d --wait
#
# Gateways on other machines (deploy/node/) need these services of this host, and nothing
# else; the management API never calls them:
#
#   pacod-postgres        configuration, limit counters, the instance registry
#   gw-analytics (8090)   where their usage events go
#   pacod-otel (4318)     where their traces go
#   gw-valkey (6380)      the response cache's answers, shared with the gateways here, over TLS
#
# This file publishes those on PGW_CLUSTER_BIND, which must be this host's address on a
# private network (a VLAN, a cloud VPC or a VPN such as WireGuard). The analytics port also
# serves the reports; both are protected by PGW_INTERNAL_TOKEN. PostgreSQL and Valkey are
# protected by their passwords. Valkey is published with TLS only, with the certificate and key
# in PGW_VALKEY_TLS_DIR (deploy/valkey/tls/README.md); for TLS on PostgreSQL see the runbook.
#
# It also lets Prometheus reach the gateways' metrics port on the other machines (list them
# in prometheus/targets/nodes.yml), and Caddy balances over them once PGW_DATA_UPSTREAMS
# names them. The network "hub" spans the machines; everything else stays on pacod-net. Allow, in the firewalls:
#
#   gateways -> this host   PGW_CLUSTER_POSTGRES_PORT, PGW_CLUSTER_ANALYTICS_PORT, PGW_CLUSTER_OTLP_PORT,
#                           PGW_CLUSTER_VALKEY_PORT
#   this host -> gateways   8080 (Caddy), 9100 (Prometheus)
#
# PostgreSQL allows 100 connections (docker-compose.standalone.yml): the management instance takes 10,
# every gateway 4. Raise max_connections there before running more than about 20 gateways.

services:
  pacod-postgres:
    ports:
      - "${PGW_CLUSTER_BIND:-127.0.0.1}:${PGW_CLUSTER_POSTGRES_PORT:-5432}:5432"
    networks: [pacod-net, hub]

  gw-analytics:
    ports:
      - "${PGW_CLUSTER_BIND:-127.0.0.1}:${PGW_CLUSTER_ANALYTICS_PORT:-8090}:8090"
    networks: [pacod-net, hub]

  pacod-otel:
    ports:
      - "${PGW_CLUSTER_BIND:-127.0.0.1}:${PGW_CLUSTER_OTLP_PORT:-4318}:4318"
    networks: [pacod-net, hub]

  # Its TLS port only: the password and the sealed answers do not cross the network in the clear.
  gw-valkey:
    ports:
      - "${PGW_CLUSTER_BIND:-127.0.0.1}:${PGW_CLUSTER_VALKEY_PORT:-6380}:6380"
    volumes:
      - ${PGW_VALKEY_TLS_DIR:-./valkey/tls}:/run/valkey-tls:ro
    networks: [pacod-net, hub]

  pacod-prometheus:
    # To scrape the gateways on the other machines.
    networks: [pacod-net, hub]

networks:
  # Not internal: Prometheus needs a route to the other machines.
  hub:
