# pacod-gw: development override of the app file. "make dev-up" uses it together with the app
# file, the standalone file and its development override, and the load test files:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml \
#     -f deploy/docker-compose.standalone.yml -f deploy/docker-compose.standalone.dev.yml \
#     -f deploy/docker-compose.load.yml -f deploy/docker-compose.load.dev.yml up -d --build --wait
#
# What it changes, for the gateway's own services:
#   - builds the four images from the working tree instead of pulling released ones;
#   - adds gw-mock, a scripted LLM provider (register it as a provider with the base URL
#     http://gw-mock:9000);
#   - gives every secret a fixed development value, so no deploy/.env is needed. deploy/.env,
#     which may hold the production secrets, does not change them here: the volumes keep the
#     passwords and keys they were made with (provider API keys still come from it);
#   - publishes the services on the host, on 127.0.0.1 only (PGW_DEV_BIND) and on ports
#     between 10000 and 19999, which do not collide with the other stacks on the
#     development machine.
#
# docker-compose.standalone.dev.yml does the same for the shared components (pacod-id built from
# vendor/pacod-id, pacod-mailpit, the development Caddy). The ports of both:
#
#       core data plane   18080      console (via Caddy)  13000
#       core management   18081      postgres             15433
#       core metrics      19100      clickhouse (HTTP)    18123
#       analytics         18090      grafana              13001
#       gw-mock           19000      prometheus           19090
#       alertmanager      19093
#       tester            18095      otel collector OTLP  14318
#       pacod-id (Caddy)  13070      pacod-id internal    18071
#       pacod-id metrics  19170      mailpit (web)        18025
#       load agent        18096      gw-load-mock         19001
#
# The load agent and its mock come from docker-compose.load.yml and docker-compose.load.dev.yml,
# which "make dev-up" adds after the standalone files.
#
# "PGW_AUTH=oidc make dev-up" signs people in through pacod-id; the first administrator is
# admin@example.com with the password pacod-gw-dev, as the core's own first administrator.
#
# docker-compose.dev.https.yml adds Caddy on ports 80 and 443, with https://api.localhost and
# https://console.localhost as in production ("make dev-up DEV_HTTPS=1"). It is also the way
# to use the stack from another machine (runbook, section 11).
#
# PostgreSQL, analytics and the collector are published so that a gateway playing another
# machine (deploy/node/docker-compose.dev.yml) can reach them, as one would over a private
# network. docker-compose.scale.dev.yml adds the scale layout.
#
# The console is published through Caddy and not straight from the gw-console container: the
# console builds its origin from the Host header and X-Forwarded-Proto, and without the proxy it
# would assume https and reject the login form on http://localhost:13000.
#
# The defaults below are public. Never use this file for anything reachable by others.

services:
  gw-preflight:
    environment:
      GW_DB_PASSWORD: pacod_gw_dev_postgres
      CLICKHOUSE_PASSWORD: pacod_gw_dev_clickhouse
      PGW_KEK: ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=
      PGW_KEK_ID: dev
      PGW_KEK_OLD: ""
      PGW_KEY_PEPPER: dev-only-pepper-do-not-use-in-prod
      PGW_INTERNAL_TOKEN: dev-only-internal-token-0123456789
      PGW_ID_CLIENT_SECRET: dev-only-core-client-secret-0123456789
      PGW_UI_CLIENT_SECRET: dev-only-console-client-secret-012345678
      PGW_UI_SESSION_SECRET: dev-only-console-session-secret-01234567
      TESTER_ID_CLIENT_SECRET: dev-only-tester-client-secret-0123456789

  gw-clickhouse:
    environment:
      CLICKHOUSE_PASSWORD: pacod_gw_dev_clickhouse
    ports:
      - "${PGW_DEV_BIND:-127.0.0.1}:18123:8123"

  pacod-gw:
    image: pacod-gw-core:dev
    build:
      context: ..
      dockerfile: deploy/docker/rust.Dockerfile
      target: core
    environment:
      DATABASE_URL: postgres://pacod_gw:pacod_gw_dev_postgres@pacod-postgres:5432/pacod_gw
      PGW_KEK: ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=
      PGW_KEK_ID: dev
      PGW_KEK_OLD: ""
      PGW_KEY_PEPPER: dev-only-pepper-do-not-use-in-prod
      PGW_INTERNAL_TOKEN: dev-only-internal-token-0123456789
      PGW_ADMIN_EMAIL: admin@example.com
      PGW_ADMIN_PASSWORD: pacod-gw-dev
      # The mock providers live on private addresses, which the egress check refuses unless
      # they are named here: gw-mock, and gw-load-mock for load tests.
      PGW_EGRESS_ALLOW_PRIVATE: ${PGW_EGRESS_ALLOW_PRIVATE:-gw-mock,gw-load-mock}
      # The links in account emails point at the console as the browser reaches it here.
      PGW_CONSOLE_URL: ${PGW_CONSOLE_URL:-http://127.0.0.1:13000}
      # pacod-id of docker-compose.standalone.dev.yml (pacod-id/pacod-id.dev.toml).
      PGW_ID_ISSUER: http://127.0.0.1:13070
      PGW_ID_CLIENT_SECRET: dev-only-core-client-secret-0123456789
      RUST_LOG: ${RUST_LOG:-info,pacod_gw_core=debug}
      PGW_LOG_FORMAT: ${PGW_LOG_FORMAT:-text}
    ports:
      - "${PGW_DEV_BIND:-127.0.0.1}:18080:8080"
      - "${PGW_DEV_BIND:-127.0.0.1}:18081:8081"
      - "${PGW_DEV_BIND:-127.0.0.1}:19100:9100"

  gw-analytics:
    image: pacod-gw-analytics:dev
    build:
      context: ..
      dockerfile: deploy/docker/rust.Dockerfile
      target: analytics
    environment:
      CLICKHOUSE_PASSWORD: pacod_gw_dev_clickhouse
      PGW_INTERNAL_TOKEN: dev-only-internal-token-0123456789
      # The mock's price list, for the price job of the smoke test.
      PGW_EGRESS_ALLOW_PRIVATE: ${PGW_EGRESS_ALLOW_PRIVATE:-gw-mock}
      RUST_LOG: ${RUST_LOG:-info,pacod_gw_analytics=debug}
      ANALYTICS_LOG_FORMAT: ${PGW_LOG_FORMAT:-text}
    ports:
      - "${PGW_DEV_BIND:-127.0.0.1}:18090:8090"

  gw-console:
    image: pacod-gw-ui:dev
    build:
      context: ..
      dockerfile: deploy/docker/ui.Dockerfile
    environment:
      # The development Grafana, published on 13001.
      GRAFANA_URL: ${PGW_GRAFANA_URL:-http://localhost:13001/}
      PGW_ID_ISSUER: http://127.0.0.1:13070
      PGW_UI_CLIENT_SECRET: dev-only-console-client-secret-012345678
      PGW_UI_SESSION_SECRET: dev-only-console-session-secret-01234567
      PGW_CONSOLE_URL: http://127.0.0.1:13000

  gw-tester:
    image: pacod-gw-tester:dev
    build:
      context: ..
      dockerfile: deploy/docker/tester.Dockerfile
    environment:
      # The gateway reaches the mock by this name; the tester scripts it the same way. Fixed,
      # like the stack's secrets: a deploy/.env value meant for production must not point the
      # development tester elsewhere, or stop it when it is not a URL.
      TESTER_MOCK_URL: http://gw-mock:9000
      TESTER_MOCK_CONTROL_URL: http://gw-mock:9000
      TESTER_ID_CLIENT_SECRET: dev-only-tester-client-secret-0123456789
    ports:
      - "${PGW_DEV_BIND:-127.0.0.1}:18095:8095"

  gw-mock:
    image: pacod-gw-mock:dev
    container_name: gw-mock
    build:
      context: ..
      dockerfile: deploy/docker/rust.Dockerfile
      target: mock
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["--listen", "0.0.0.0:9000"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "tcp://127.0.0.1:9000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    ports:
      - "${PGW_DEV_BIND:-127.0.0.1}:19000:9000"
    networks: [pacod-net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
