# A load agent that plays another machine, for development (make load-agent-dev-up):
#
#   docker compose -p pacod-gw-load-agent-dev -f deploy/load-agent/docker-compose.yml \
#     -f deploy/load-agent/docker-compose.dev.yml up -d --build --wait
#
# It shares no Docker network with the development stack: like an agent on another machine it
# reaches the gateway only through the port the stack publishes (host.docker.internal:18080),
# and the stack's tester reaches it through the port published here:
#
#   load agent "remote"   18196   (the development tester lists it as remote)
#
# The values are fixed and public, whatever an env file says: never for anything reachable by
# others.

services:
  gw-preflight:
    environment:
      LOAD_AGENT_TOKEN: dev-only-load-agent-token-0123456789abcdef
      LOAD_AGENT_TARGET_URL: http://host.docker.internal:18080
      LOAD_AGENT_BIND: 127.0.0.1

  gw-load-agent:
    image: pacod-gw-load-agent:dev
    build:
      context: ../..
      dockerfile: deploy/docker/rust.Dockerfile
      target: load-agent
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      LOAD_AGENT_NAME: remote
      LOAD_AGENT_TARGET_URL: http://host.docker.internal:18080
      LOAD_AGENT_TOKEN: dev-only-load-agent-token-0123456789abcdef
      LOAD_AGENT_CA_FILE: ""
      LOAD_AGENT_LOG_FORMAT: ${LOAD_AGENT_LOG_FORMAT:-text}
    volumes: !reset []
    ports: !override
      - "127.0.0.1:18196:8096"
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 512M }
