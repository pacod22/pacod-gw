# Prometheus for the pacod-gw compose stack.
#
# The core exposes its metrics on port 9100; crates/pacod-gw-core/src/telemetry/metrics.rs
# lists them. Some of its series carry their own "instance" label, the core's instance id
# (PGW_INSTANCE_ID). Every target in targets/ names the same id as its "instance" label, and
# honor_labels keeps the core's own; so "instance" is the instance id on every series, as in
# the console. The alert rules and dashboards use "instance".
#
# The instances are listed in files that Prometheus re-reads by itself:
#   targets/core.yml               the core of the compose stack (always)
#   targets-scale/gateways.yml     the gateways of docker-compose.scale.yml
#   targets/nodes.yml              gateways on other machines (copy nodes.yml.example)

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# Alerts are evaluated here and shown on the Alerts page of Prometheus and in Grafana, and
# delivered by the Alertmanager of the stack: by email and to a webhook when deploy/.env says
# where (PGW_ALERT_EMAIL_TO, PGW_ALERT_WEBHOOK_URL; deploy/alertmanager/render.sh).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pacod-gw-core
    honor_labels: true
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
          - /etc/prometheus/targets-scale/*.yml
        refresh_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
