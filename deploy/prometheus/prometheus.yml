# Prometheus for the pacod-gw compose stack: pacod-prometheus of docker-compose.standalone.yml.
#
# The gateway's scrape jobs (pacod-gw-core, otel-collector) are not here but in
# platform/prometheus/gw.yml, the fragment the full stack (pacod-demo) loads as well; compose
# mounts platform/prometheus at /etc/prometheus/scrape.d. This file holds what only the gateway's
# own stack scrapes: Prometheus itself and the pacod-id it bundles. The full stack defines those
# once, for every product.
#
# The gateways besides the core are listed in files that Prometheus re-reads by itself
# (platform/prometheus/gw.yml says where):
#   targets/nodes.yml              gateways on other machines (copy nodes.yml.example)
#   targets-scale/gateways.yml     the gateways of docker-compose.scale.yml

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# Alerts are evaluated here and shown on the Alerts page of Prometheus and in Grafana, and
# delivered by the Alertmanager of the stack: by email and to a webhook when deploy/.env says
# where (PGW_ALERT_EMAIL_TO, PGW_ALERT_WEBHOOK_URL; deploy/alertmanager/render.sh).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["pacod-alertmanager:9093"]

# Every product's scrape jobs, one file each (platform/prometheus/*.yml of each repository).
scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

scrape_configs:
  - job_name: pacod-id
    static_configs:
      - targets: ["pacod-id:9170"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
