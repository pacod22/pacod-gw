# cargo-deny: licences, banned and duplicate crates, where crates come from, and advisories.
# `make deny` runs it; so does the CI's dependency audit. Install with
# `cargo install cargo-deny --locked`.

[graph]
# Every platform: the images are Linux, development happens on macOS.
targets = []
all-features = false
no-default-features = false

[advisories]
# The RustSec database, as `cargo audit` reads it. An advisory that does not apply is
# ignored here with its id and the reason, never by upgrading in a hurry.
ignore = []

[licenses]
# The licences the dependency tree uses today, all permissive. A crate under any other
# licence fails the check until it has been looked at and added here or replaced.
# r-efi is "MIT OR Apache-2.0 OR LGPL-2.1-or-later": the first two are taken.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
# The workspace's own crates are Apache-2.0 (Cargo.toml, LICENSE) and checked like the rest.
ignore = false
registries = []

[bans]
# Several versions of one crate cost build time and size, but are often unavoidable.
multiple-versions = "warn"
# Every dependency names a version; path dependencies inside the workspace are fine.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # TLS goes through rustls; a second, system-dependent stack must not creep in.
    { crate = "openssl-sys", use-instead = "rustls" },
]
skip = []
skip-tree = []

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
